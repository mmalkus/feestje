<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Dossier Verdwenen Taart</title>
<meta name="theme-color" content="#1f4047">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lexend:wght@400;600;800&family=Special+Elite&display=swap">
<style>
/* Layout: one manila case-file folder lying on a blue-green desk; each screen is a page inside the folder */
:root{
  --desk:#1f4047; --desk-2:#163238; --folder:#e9d29c; --folder-edge:#cdb173;
  --paper:#fdf8ea; --ink:#2b2420; --ink-soft:#6b5d4f; --stamp:#c42f28;
  --tape:#f4d43c; --good:#2d8549; --line:#d9cba8;
  --f-display:"Bungee", "Arial Black", Impact, sans-serif;
  --f-body:"Lexend", "Trebuchet MS", system-ui, sans-serif;
  --f-type:"Special Elite", "Courier New", ui-monospace, monospace;
  color-scheme:light;
}
html{background:var(--desk)}
html,body{min-height:100%}
body{
  background:var(--desk);
  background-image:radial-gradient(circle at 20% 10%, rgba(255,255,255,.06), transparent 50%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 2px, transparent 2px 40px);
  color:var(--ink); font-family:var(--f-body); font-size:18px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:16px calc(16px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:560px; margin:0 auto}
@media (min-width:700px){ #app{max-width:640px} }
.folder{
  position:relative; background:var(--folder); border-radius:4px 14px 10px 10px;
  box-shadow:0 2px 0 var(--folder-edge), 0 18px 40px rgba(0,0,0,.35);
  padding:28px 20px 24px; margin-top:22px;
}

/* the label is the folder tab, so the tab always fits its text; a long team name is shortened, the step number never */
.tab-label{position:absolute; top:-20px; left:0; display:flex; box-sizing:border-box; min-width:42%; max-width:calc(100% - 24px); height:22px;
  padding:4px 16px 0; background:var(--folder); border-radius:10px 10px 0 0; white-space:nowrap;
  font-family:var(--f-type); font-size:14px; line-height:18px; color:var(--ink-soft); letter-spacing:.06em}
.tab-label .tl-a{overflow:hidden; text-overflow:ellipsis; min-width:0}
.tab-label .tl-b{flex:none}
@media (max-width:400px){ .tab-label{font-size:12px; letter-spacing:.03em; padding-inline:12px} }
.stack{display:flex; flex-direction:column; gap:16px}
.stamp{
  display:inline-block; font-family:var(--f-display); color:var(--stamp);
  border:3px solid var(--stamp); border-radius:6px; padding:2px 10px; font-size:15px;
  transform:rotate(-6deg); letter-spacing:.06em; opacity:.88; align-self:flex-start;
}
h1,h2{font-family:var(--f-display); font-weight:400; line-height:1.1; margin:0; text-wrap:balance; overflow-wrap:break-word; hyphens:auto}
/* sized so the longest word ("VERJAARDAGSTAART") still fits a 320px phone */
h1{font-size:clamp(21px, 6.4vw, 40px)}
h2{font-size:clamp(20px, 5.6vw, 28px)}
p{margin:0}
.type{font-family:var(--f-type)}
.muted{color:var(--ink-soft)}
.paper{
  background:var(--paper); border-radius:3px; padding:20px 18px;
  box-shadow:0 1px 0 var(--line), 0 6px 14px rgba(60,40,10,.18);
  background-image:repeating-linear-gradient(transparent 0 31px, rgba(80,120,180,.14) 31px 32px);
  background-position:0 10px; position:relative;
}
.paper.tilt{transform:rotate(-.6deg)}
.tape{position:absolute; top:-12px; left:50%; width:96px; height:24px; margin-left:-48px;
  background:var(--tape); opacity:.85; transform:rotate(3deg); box-shadow:0 1px 2px rgba(0,0,0,.15)}
.riddle{font-size:clamp(18px, 5.6vw, 22px); font-weight:600; line-height:1.45; white-space:pre-line}
.btn{
  appearance:none; border:0; border-radius:12px; min-height:56px; padding:12px 20px;
  font:800 19px/1.2 var(--f-body); cursor:pointer; color:#fff; background:var(--stamp);
  box-shadow:0 4px 0 #8e1f1a; transition:transform .08s;
}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 #8e1f1a}
.btn.alt{background:var(--paper); color:var(--ink); box-shadow:0 4px 0 var(--folder-edge)}
.btn.small{min-height:44px; font-size:16px; padding:8px 14px}
.btn.ghost{background:transparent; color:var(--ink-soft); box-shadow:none; font-weight:600; min-height:44px; text-decoration:underline}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--tape); outline-offset:2px}
.row{display:flex; gap:10px; flex-wrap:wrap}
.row > *{flex:1 1 140px}
input[type=text],input[type=password],textarea,select{
  width:100%; box-sizing:border-box; font:600 18px var(--f-body); color:var(--ink);
  background:#fff; border:2px solid var(--folder-edge); border-radius:10px; padding:12px;
}
textarea{min-height:84px; resize:vertical; font-weight:400}
.code-input{font-family:var(--f-type)!important; font-size:26px!important; text-align:center; letter-spacing:.2em; text-transform:uppercase}
label.lbl{font-size:14px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:4px; letter-spacing:.03em}
.progress{display:flex; gap:6px; align-items:center}
.dot{flex:1; height:10px; border-radius:5px; background:rgba(43,36,32,.15)}
.dot.done{background:var(--good)} .dot.now{background:var(--stamp)}
.msg{min-height:1.5em; font-weight:600; text-align:center}
.msg.bad{color:var(--stamp)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.evidence{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
.evidence li{background:var(--paper); border-left:6px solid var(--tape); padding:10px 12px; border-radius:3px; font-size:16px; display:flex; gap:10px}
.evidence .nr{font-family:var(--f-type); color:var(--stamp); flex:none}
.overlay{position:fixed; inset:0; background:rgba(15,30,34,.78); display:flex; align-items:center; justify-content:center;
  padding:16px max(16px, env(safe-area-inset-right,0px)) 16px max(16px, env(safe-area-inset-left,0px)); z-index:20}
.overlay .paper{max-width:480px; width:100%; animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.85) rotate(-3deg); opacity:.4} to{transform:none; opacity:1}}
.suspects{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px}
.suspect{min-height:88px; background:var(--paper); color:var(--ink); border:3px dashed var(--folder-edge); border-radius:12px;
  font:800 19px var(--f-body); cursor:pointer; padding:10px}
.suspect.wrong{border-color:var(--stamp); opacity:.5; text-decoration:line-through}
.step-edit{border:2px solid var(--folder-edge); border-radius:10px; padding:14px; background:rgba(255,255,255,.35)}
.tabs{display:flex; gap:6px; padding:4px; border-radius:12px; background:rgba(43,36,32,.1)}
.tabs button{flex:1; min-height:44px; border:0; border-radius:9px; background:transparent; color:var(--ink-soft); font:800 16px var(--f-body); cursor:pointer}
.tabs button[aria-selected=true]{background:var(--paper); color:var(--ink); box-shadow:0 2px 0 var(--folder-edge)}
.steps{display:flex; flex-direction:column; gap:10px}
.step-edit.closed{padding-block:8px}
.step-head{display:flex; align-items:center; gap:6px}
.step-grip{flex:none; width:40px; min-height:44px; border:0; border-radius:8px; background:transparent; color:var(--ink-soft); font-size:22px; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none}
.step-toggle{flex:1; min-width:0; min-height:44px; border:0; background:transparent; color:var(--ink); text-align:left; font:16px var(--f-body); cursor:pointer; padding:4px 2px; display:flex; flex-direction:column}
.step-toggle span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px}
.step-toggle .bad{color:var(--stamp); font-weight:600}
.step-edit.dragging{position:relative; z-index:5; background:var(--paper); box-shadow:0 14px 28px rgba(0,0,0,.3); cursor:grabbing}
.step-edit.dragging .step-grip{cursor:grabbing}
.savebar{position:sticky; bottom:0; z-index:4; margin:0 -8px; padding:10px 8px calc(10px + env(safe-area-inset-bottom, 0px)); background:var(--folder); border-top:2px solid var(--folder-edge)}
.savebar .msg{min-height:0}
details.help summary{cursor:pointer; color:var(--ink-soft); font-weight:600; font-size:16px}
details.help p{margin-top:6px}
.notes-list{font-family:var(--f-type); font-size:18px; display:flex; flex-direction:column; gap:8px}
.notes-list div{background:var(--paper); padding:10px 12px; border-radius:4px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap}
.notes-list b{letter-spacing:.15em; color:var(--stamp)}
.corner{display:flex; justify-content:space-between; gap:12px; margin-top:16px}
.fs-btn{margin-right:auto;
  background:rgba(0,0,0,.25); color:#e6eef0; border:0; border-radius:20px; padding:8px 14px; font:600 13px var(--f-body); cursor:pointer}
.parents{margin-left:auto;
  background:rgba(0,0,0,.25); color:#e6eef0; border:0; border-radius:20px; padding:8px 14px; font:600 13px var(--f-body); cursor:pointer}
canvas#confetti{position:fixed; inset:0; pointer-events:none; z-index:30; width:100%; height:100%}
.hint-box{background:#fff7c2; border:2px dashed #d3b62a; border-radius:10px; padding:12px; font-size:17px}
.vh{position:absolute; width:1px; height:1px; opacity:0; overflow:hidden}
label.btn{display:flex; align-items:center; justify-content:center; text-align:center; box-sizing:border-box; position:relative}
.zoom,.jig{width:min(100%, 62vh); margin-inline:auto}
.zoom{overflow:hidden; border-radius:6px; aspect-ratio:1; background:var(--ink); margin-top:12px}
.zoom img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s}
.jig{display:grid; grid-template-columns:repeat(var(--c,3),1fr); grid-template-rows:repeat(var(--r,3),1fr); gap:3px; aspect-ratio:1; background:var(--ink); padding:3px; border-radius:6px; margin-top:12px}
.jig button{border:0; padding:0; background-size:calc(var(--c,3)*100%) calc(var(--r,3)*100%); cursor:pointer; border-radius:2px}
.jig button.sel{outline:5px solid var(--tape); outline-offset:-5px}
.jig button{touch-action:none; position:relative}
.jig button.drag{z-index:2; opacity:.85; box-shadow:0 8px 18px rgba(0,0,0,.45); cursor:grabbing}
.jig button.over{outline:5px dashed var(--tape); outline-offset:-5px}
.full{max-width:100%; max-height:62vh; border-radius:6px; display:block; margin:12px auto 0}
.slots{display:flex; gap:5px; justify-content:center; margin-top:14px}
.slot{flex:0 1 40px; min-width:0; height:50px; border-bottom:4px solid var(--ink); display:flex; align-items:flex-end; justify-content:center; font:400 26px var(--f-display); color:var(--stamp)}
.letters{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
.tile{width:54px; height:58px; font:400 26px var(--f-display); background:var(--tape); color:var(--ink); border:0; border-radius:10px; box-shadow:0 4px 0 #b39a1f; cursor:pointer}
.tile:disabled{opacity:.2; box-shadow:none}
.thumb{width:96px; height:96px; object-fit:cover; border-radius:6px; flex:none!important}
.busy{text-align:center; font-weight:600; padding:16px 0}
.busy .glass{font-size:48px; display:inline-block; animation:hunt 1.6s ease-in-out infinite}
@keyframes hunt{0%,100%{transform:translateX(-30px) rotate(-10deg)}50%{transform:translateX(30px) rotate(10deg)}}
.album{padding:0 6px; display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px}
.album img{width:100%; background:#fff; padding:6px 6px 24px; box-sizing:border-box; box-shadow:0 4px 10px rgba(0,0,0,.25); transform:rotate(-2deg)}
.album img:nth-child(even){transform:rotate(2deg)}
.viewfinder{position:relative; margin:12px auto 0; width:min(100%, calc(62vh * 4 / 3)); border-radius:6px; overflow:hidden; background:#000; aspect-ratio:4/3}
.viewfinder video{width:100%; height:100%; object-fit:cover; display:block}
.viewfinder video.mirror{transform:scaleX(-1)}
.viewfinder .count{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:400 120px var(--f-display); color:#fff; text-shadow:0 4px 14px rgba(0,0,0,.6); pointer-events:none}
.viewfinder .flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none}
.viewfinder .flash.go{animation:flash .5s ease-out}
@keyframes flash{from{opacity:1} to{opacity:0}}
/* "Zoek deze plek": the drawing, the viewfinder and the snap button share one phone screen, so nobody scrolls while aiming.
   The question comes on its own screen first; the room left after the buttons (about 300px) goes 45/55 to the drawing and the viewfinder. */
.full.sketch{max-height:42vh; background:#fff}
.paper.hunt{padding-block:16px}
.paper.hunt .full.sketch{max-height:min(42vh, max(110px, calc((100vh - 300px) * .45)))}
.viewfinder.hunt{width:min(100%, calc(4 / 3 * min(62vh, max(150px, calc((100vh - 300px) * .55)))))}
@supports (height:100svh){
  .paper.hunt .full.sketch{max-height:min(42svh, max(110px, calc((100svh - 300px) * .45)))}
  .viewfinder.hunt{width:min(100%, calc(4 / 3 * min(62svh, max(150px, calc((100svh - 300px) * .55)))))}
}
.viewfinder .meter{position:absolute; left:0; right:0; bottom:0; padding:22px 10px 6px; pointer-events:none;
  background:linear-gradient(transparent, rgba(0,0,0,.6))}
.viewfinder .meter .meter-track{height:16px}
.viewfinder .meter .meter-txt{color:#fff; margin-top:4px; font-size:clamp(15px, 4.4vw, 20px); text-shadow:0 1px 3px rgba(0,0,0,.7)}
.viewfinder .ghost{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.55; mix-blend-mode:multiply; pointer-events:none}
.meter-track{position:relative; height:24px; border-radius:12px; overflow:hidden; box-shadow:inset 0 1px 3px rgba(0,0,0,.35);
  background:linear-gradient(90deg, #4aa3c7, #9fd3ee 30%, #f4d43c 60%, #e8843a 80%, #c42f28)}
.meter-track span{position:absolute; top:0; right:0; bottom:0; background:#5b524a; transition:width .3s}
.meter-txt{text-align:center; font:400 clamp(17px, 5vw, 22px)/1.2 var(--f-display); margin-top:8px}
.btn.pulse{animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.ailog{white-space:pre-wrap; overflow-wrap:anywhere; font:12px/1.4 ui-monospace, Menlo, monospace; margin:6px 0 0; color:var(--ink)}
.check{display:flex; gap:10px; align-items:center; font-size:16px}
.check input{width:24px; height:24px}
.paper .say{display:block; margin:10px auto 0}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
</style>

</head><body>
<div id="app"></div>
<canvas id="confetti" hidden></canvas>

<script>
(function(){
/* Step types: code = riddle + note with code; photo = "waar is dit?" zoomed photo + note; jigsaw = swap-tile photo puzzle + note;
   scramble = letter puzzle on the tablet; camera = photo assignment, optionally turned into a detective picture;
   match = see a drawing of a spot, find it and photograph it (checked on the device, with an optional AI second opinion). */
const TYPES = { code:"Raadsel + briefje", photo:"Waar is dit? (foto)", jigsaw:"Fotopuzzel", scramble:"Letterpuzzel", camera:"Foto-opdracht", match:"Zoek deze plek (foto-match)" };
// pass = corners that must agree between the parent's photo and the kids' photo (unrelated photos reach about 5–11)
const MATCH_LEVELS = { easy:{ name:"Makkelijk (kleine kinderen)", pass:12 }, normal:{ name:"Normaal", pass:18 }, strict:{ name:"Streng (precies dezelfde foto)", pass:30 } };
const passFor = s => (MATCH_LEVELS[s.level] || MATCH_LEVELS.normal).pass;
const JIG_SIZES = ["3x3","3x4","4x4","4x5","5x5"]; // photo puzzle: columns x rows
const jigSize = s => { const [c, r] = (JIG_SIZES.includes(s.grid) ? s.grid : JIG_SIZES[0]).split("x").map(Number); return { c, r }; };
const NOTE_TYPES = ["code","photo","jigsaw"];

const DEFAULT = {
  title: "De Verdwenen Verjaardagstaart",
  story: "Vanochtend stond er een prachtige verjaardagstaart in de keuken. En nu… is hij WEG! Iemand heeft hem gestolen. Jullie zijn de beste detectives van het hele huis. Volg de aanwijzingen, vind de geheime codes en ontmasker de dader!",
  culpritIndex: 0,
  suspects: ["Papa", "Mama", "De kat", "Een stoute kabouter"],
  finalHide: "In de oven (die staat UIT!) 🎂",
  steps: [
    { type: "camera", ai: true, clue: "Elk detectivebureau heeft een teamfoto nodig! Ga allemaal bij elkaar staan en trek jullie slimste speurneus-gezicht.", evidence: "" },
    { type: "code", clue: "Binnen ben ik koud,\nmaar ik zorg goed voor jullie kaas en melk.\nKijk eens in mijn deur!", place: "Koelkastdeur", code: "SPOOR", hint: "Het staat in de keuken en het zoemt.", evidence: "Er zit slagroom op de deurklink van de keuken. De dader had dus grote handen…" },
    { type: "code", clue: "Ik heb vier poten, maar ik loop nooit.\nAls het eten klaar is, zit iedereen bij mij.\nKruip eens onder mij!", place: "Onder de eettafel", code: "LOEP", hint: "Hier eten jullie elke avond aan.", evidence: "Onder de tafel ligt een schoenafdruk. Maat 44! Dat is een hele grote voet." },
    { type: "scramble", clue: "De dader heeft een woord door elkaar gehusseld! Tik de letters in de goede volgorde.", code: "KRUIMEL", hint: "Wat valt er op de grond als je taart eet?", evidence: "KRUIMEL! Er loopt een spoor van taartkruimels door de gang…" },
    { type: "code", clue: "Ik zit vol met verhalen,\nmaar praten kan ik niet.\nZoek tussen mijn bladzijden!", place: "Boekenkast", code: "VINGER", hint: "Je leest ze voor het slapengaan.", evidence: "In een boek zit een briefje: ‘Niet vergeten: taart verstoppen!’ Het handschrift is erg slordig." },
    { type: "code", clue: "Overdag sta ik bij de deur te wachten.\nIk ruik een beetje naar voeten.\nWie zoekt, die vindt!", place: "Schoenenrek", code: "SLEUTEL", hint: "Hier zet je je schoenen neer als je thuiskomt.", evidence: "In een grote schoen zitten taartkruimels. Chocola!" },
    { type: "code", clue: "Ik heb kussens, maar ik slaap nooit.\nWie op mij zit, kijkt vaak tv.\nVoel eens tussen mijn kussens!", place: "Tussen de kussens van de bank", code: "GEHEIM", hint: "Het is het zachtste meubel in de woonkamer.", evidence: "Tussen de kussens ligt een stropdas met een vlek van slagroom." },
    { type: "code", clue: "Ik draai en draai en draai,\nmaar ik word nooit duizelig.\nIk maak jullie kleren weer schoon!", place: "Bij de wasmachine", code: "TAART", hint: "Kijk waar de vuile was naartoe gaat.", evidence: "Op de wasmachine ligt een bril met chocola op het glas. Wie draagt er een bril én een stropdas?" }
  ]
};
/* Image providers. style: "edits" = OpenAI-style /images/edits (photo in, edited photo out);
   "chat" = /chat/completions with image output (OpenRouter, Gemini image models);
   "mistral" = Mistral agent with the image_generation tool (draws a new picture from a description of the photo). */
const PROVIDERS = {
  openai:     { name:"OpenAI",     base:"https://api.openai.com/v1",    style:"edits",   model:"gpt-image-1", vision:"gpt-4.1-mini" },
  openrouter: { name:"OpenRouter", base:"https://openrouter.ai/api/v1", style:"chat",    model:"google/gemini-2.5-flash-image", vision:"google/gemini-2.5-flash" },
  mistral:    { name:"Mistral",    base:"https://api.mistral.ai/v1",    style:"mistral", model:"mistral-medium-latest", vision:"mistral-medium-latest" },
  custom:     { name:"Anders (zelf invullen)", base:"", style:"edits", model:"", vision:"" }
};
const STYLES = { edits:"Foto bewerken (/images/edits)", chat:"Chat met plaatje terug (/chat/completions)", mistral:"Mistral agent (image_generation)" };
const AI_DEFAULT = {
  provider: "openai", keys: {}, base: PROVIDERS.openai.base, style: "edits", model: "gpt-image-1", models: [], verify: true, // verify: AI second opinion on "Zoek deze plek"
  prompt: "Turn this photo into a bright, friendly children's picture-book illustration in which everyone is a detective: deerstalker hats, magnifying glasses, little trench coats, a playful mystery atmosphere with a birthday cake hidden somewhere. Keep exactly the same people, their faces, hair, poses and the number of people. Cheerful, warm, kid-friendly, no text."
};

/* Voices for reading the texts aloud. ElevenLabs: own (cloned/designed) voices via its voice list;
   "openai" and "custom" use the OpenAI-style POST /audio/speech (also self-hosted servers). */
const TTS_PROVIDERS = {
  elevenlabs: { name:"ElevenLabs", base:"https://api.elevenlabs.io/v1", model:"eleven_multilingual_v2", voice:"JBFqnCBsd6RMkjVDRZzb" },
  openai:     { name:"OpenAI",     base:"https://api.openai.com/v1",   model:"gpt-4o-mini-tts",        voice:"fable" },
  custom:     { name:"Anders (OpenAI-compatibel /audio/speech)", base:"", model:"", voice:"" }
};
const OPENAI_VOICES = ["alloy","ash","ballad","cedar","coral","echo","fable","marin","nova","onyx","sage","shimmer","verse"];
const TTS_DEFAULT = { on:false, provider:"elevenlabs", keys:{}, ...TTS_PROVIDERS.elevenlabs, voices:[],

// A clip is reused only for the same text with the same voice settings.
const lineKey = text => "v-" + hash([tts.provider, tts.base, tts.model, tts.voice, tts.style, text].join("|"));
const ttsReady = () => !!(tts.on && ttsKey() && tts.base && tts.model && tts.voice);

async function ttsFetch(path, json){
  const url = tts.base.trim().replace(/\/+$/,"") + path;
  const headers = { ...(tts.provider==="elevenlabs" ? { "xi-api-key":ttsKey() } : { Authorization:`Bearer ${ttsKey()}` }), ...(json ? { "Content-Type":"application/json" } : {}) };
  let r;
  try{ r = await fetch(url, { method: json ? "POST" : "GET", headers, body: json && JSON.stringify(json) }); }
  catch(e){ const host = (()=>{ try{ return new URL(url).host; }catch(_){ return tts.base; } })();
    throw new Error(`${host} gaf geen antwoord. Is er internet? Zo ja, dan blokkeert de browser dit verzoek (CORS).`); }
  if (!r.ok){ const txt = await r.text().catch(()=>""), j = (()=>{ try{ return JSON.parse(txt); }catch(_){ return {}; } })();
    throw new Error(`${r.status}: ${(errText(j) || txt || r.statusText).slice(0,200)}`); }
  return r;
}
async function synth(text){
  const r = tts.provider==="elevenlabs"
    ? await ttsFetch(`/text-to-speech/${encodeURIComponent(tts.voice)}?output_format=mp3_44100_128`, { text, model_id:tts.model })
    : await ttsFetch("/audio/speech", { model:tts.model, voice:tts.voice, input:text, response_format:"mp3",
        ...(tts.style && !/^tts-1/.test(tts.model) ? { instructions:tts.style } : {}) }); // tts-1 doesn't take instructions
  const blob = await r.blob();
  if (!blob.size || /json|text/.test(blob.type)) throw new Error("Geen geluid ontvangen");
  return blob;
}
async function fetchVoices(){
  if (tts.provider==="openai") return OPENAI_VOICES.map(id=>({ id, name:id }));
  if (tts.provider==="elevenlabs"){ // own voices (cloned, designed, from the library) first
    const j = await (await ttsFetch("/voices")).json();
    return (j.voices||[]).map(v=>({ id:v.voice_id, name:v.name, own:v.category!=="premade" })).sort((a,b)=>(b.own-a.own) || a.name.localeCompare(b.name));
  }
  const j = await (await ttsFetch("/audio/voices")).json(), list = Array.isArray(j) ? j : (j.voices || j.data || []);
  return list.map(v=> typeof v==="string" ? { id:v, name:v } : { id:v.id||v.voice_id||v.name, name:v.name||v.id }).filter(v=>v.id);
}
// Speaks every line that isn't stored yet; progress(done, total).
async function prepareSpeech(team, progress=()=>{}){
  const todo = [...new Set(Object.values(speechLines(team)))].filter(t=>!clips.has(lineKey(t))), total = todo.length;
  let done = 0, failed = false; progress(done, total);
  const worker = async () => { try{ while (todo.length && !failed){ const t = todo.shift(), k = lineKey(t), b = await synth(t);
    clips.set(k, b); DB.put(k, b, "tts").catch(()=>{}); if (!failed) progress(++done, total); } }
    catch(e){ failed = true; throw e; } };
  await Promise.all([worker(), worker()]); // two at a time: quicker, and within ElevenLabs' smallest concurrency limit
}
function gcClips(team){
  const keep = new Set(Object.values(speechLines(team)).map(lineKey));
  [...clips.keys()].forEach(k=>{ if (!keep.has(k)){ clips.delete(k); buffers.delete(k); DB.del(k, "tts").catch(()=>{}); } });
}
const hasClip = slot => { const t = ttsReady() && speechLines(prog.team)[slot]; return !!t && clips.has(lineKey(t)); };
let voiceSrc = null, sayToken = 0;
function hush(){ sayToken++; try{ voiceSrc?.stop(); }catch(e){} voiceSrc = null; }
async function playBlob(key, blob, delay=0){
  hush(); const token = sayToken;
  if (!actx || !blob) return false;
  try{
    let buf = buffers.get(key);
    if (!buf){ buf = await actx.decodeAudioData(await blob.arrayBuffer()); if (key) buffers.set(key, buf); }
    if (token !== sayToken) return true; // something else started talking meanwhile
    const src = actx.createBufferSource(); src.buffer = buf; src.connect(actx.destination); src.start(actx.currentTime + delay); voiceSrc = src;
    return true;
  }catch(e){ console.warn(e); return false; }
}
function say(slot, delay){
  if (!ttsReady()) return;
  const t = speechLines(prog.team)[slot], k = t && lineKey(t);
  playBlob(k, k && clips.get(k), delay);
}
// The line that goes with what's on screen; it is read once when the screen appears.
// undefined = an overlay without a line (e.g. parents approving): quiet, without re-reading the screen after it closes.
function autoSlot(){
  if (ui.view) return "";
  if (ui.overlay) return ui.overlaySlot ?? undefined;
  if (prog.phase==="clue"){ const s = cfg.steps[prog.index]; return kind(s)==="jigsaw" && prog.sub.solved ? `jig${prog.index}` : `clue${prog.index}`; }
  return { accuse:"accuse", solved:"final" }[prog.phase] || "";
}
const sayBtn = (slot, label="🔊 Nog een keer") => hasClip(slot) ? `<button class="btn ghost small say" data-act="say" data-slot="${slot}">${label}</button>` : "";

/* ---------- in-game camera (live viewfinder; falls back to the system camera via a file input) ---------- */
const cam = { stream:null, pending:null, facing:"user", error:false, busy:false };
const camOk = () => !!navigator.mediaDevices?.getUserMedia && !cam.error;
function camStop(){ cam.stream?.getTracks().forEach(t=>t.stop()); cam.stream=null; }
function camStart(){
  if (cam.stream && cam.stream.getVideoTracks()[0]?.readyState==="ended") camStop(); // e.g. after switching apps
  if (cam.stream) return Promise.resolve(cam.stream);
  return cam.pending || (cam.pending = navigator.mediaDevices.getUserMedia({ audio:false,
      video:{ facingMode:cam.facing, width:{ ideal:1920 }, height:{ ideal:1440 } } })
    .then(st => (cam.stream = st))
    .catch(err => { console.warn(err); cam.error = true; render(); return null; })
    .finally(() => { cam.pending = null; }));
}
// Called after every render: the viewfinder <video> is new each time, so (re)attach the stream, or stop it when gone.
async function camAttach(){
  if (!document.getElementById("vf")){ camStop(); return; }
  const st = await camStart(), v = document.getElementById("vf");
  if (!v){ camStop(); return; }
  if (st && v.srcObject !== st){ v.srcObject = st; v.play().catch(()=>{}); }
}
document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible") camAttach(); });
const sleep = ms => new Promise(r=>setTimeout(r,ms));
async function camSnap(countdown){
  const v = document.getElementById("vf");
  if (!v || !v.videoWidth || cam.busy) return;
  cam.busy = true; app.querySelectorAll("[data-act=snap],[data-act=timer],[data-act=flip]").forEach(b=>b.disabled=true);
  if (countdown){
    const c = document.getElementById("count");
    for (const n of [3,2,1]){ if(c) c.textContent = n; tick(false); await sleep(1000); }
    if(c) c.textContent = "";
  }
  tick(true);
  const f = document.getElementById("flash"); f?.classList.add("go");
  const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight;
  const x = c.getContext("2d");
  if (cam.facing==="user"){ x.translate(c.width,0); x.scale(-1,1); } // save it the way the kids saw it
  x.drawImage(v, 0, 0);
  await sleep(250);
  try{
    const id = await storeImage(await toBlob(c), "k-", false);
    dropImage(prog.sub.photo); dropImage(prog.sub.styled); prog.sub = { photo:id }; saveProg();
  }catch(err){ ui.msg = "Dat lukte niet. Probeer het nog een keer."; }
  cam.busy = false; render();
}

function boxBlur(a, w, h, r){
  const t = new Float32Array(w*h), o = new Float32Array(w*h), n = 2*r+1, cx = v => v<0 ? 0 : v>=w ? w-1 : v, cy = v => v<0 ? 0 : v>=h ? h-1 : v;

    for (let k=-r-1; k<r; k++) s += a[row+cx(k)];
    for (let x=0; x<w; x++){ s += a[row+cx(x+r)] - a[row+cx(x-r-1)]; t[row+x] = s/n; } }
  for (let x=0; x<w; x++){ let s = 0;
    for (let k=-r-1; k<r; k++) s += t[cy(k)*w+x];
    for (let y=0; y<h; y++){ s += t[cy(y+r)*w+x] - t[cy(y-r-1)*w+x]; o[y*w+x] = s/n; } }
  return o;

// Pencil drawing of the parent's photo (colour dodge of the grey photo with its blurred negative), so the kids get a drawing, not the answer.
async function sketchOf(id){
  const im = await loadImg(imgs.get(id)), w = im.naturalWidth, h = im.naturalHeight, c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d"); x.drawImage(im, 0, 0);
  const d = x.getImageData(0, 0, w, h), p = d.data, g = new Float32Array(w*h);
  for (let i=0; i<g.length; i++) g[i] = p[i*4]*.3 + p[i*4+1]*.59 + p[i*4+2]*.11;

  for (let k=0; k<3; k++) b = boxBlur(b, w, h, r);

  for (let i=0; i<g.length; i++){
    const v = Math.pow(Math.min(1, g[i]/Math.max(1, 255-b[i])), 3); // 1 = paper, 0 = pencil line
    for (let k=0; k<3; k++) p[i*4+k] = ink[k] + (paper[k]-ink[k])*v;

  c.width = 480; c.height = Math.round(480*im.naturalHeight/im.naturalWidth);

const qualityText = q => q >= 70 ? `✓ Goed herkenbaar (${q} punten).`
  : q >= 35 ? `Redelijk herkenbaar (${q} punten). Lukt het niet, kies dan ‘Makkelijk’ of zet de AI aan.`
  : `⚠ Weinig details (${q} punten): de tablet herkent deze plek slecht. Kies een plek met meer spullen of patronen, of fotografeer van iets dichterbij.`;

// AI second opinion: a model that can look at photos compares the two (same service and key as the detective drawings).
const aiVerifyReady = () => !!(ai.verify && aiKey() && ai.base && ai.visionModel);
async function aiSameSpot(refId, id){
  aiLog = [];
  const small = async src => { const im = await loadImg(imgs.get(src)), sc = Math.min(1, 768/Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement("canvas");
    c.width = Math.round(im.naturalWidth*sc); c.height = Math.round(im.naturalHeight*sc); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
    return blobToDataUrl(await toBlob(c)); };
  const mistral = ai.provider==="mistral" || /mistral\.ai/.test(ai.base); // Mistral wants the data URL as a plain string
  const pic = url => ({ type:"image_url", image_url: mistral ? url : { url } });
  const j = await api("/chat/completions", { json:{ model:ai.visionModel, messages:[{ role:"user", content:[
    { type:"text", text:"You are the referee of a children's photo scavenger hunt in a house. Image 1 is the reference photo of a hiding spot. Image 2 was just taken by the children. Does image 2 show the same spot (the same object or place), allowing for a different angle, distance, zoom, lighting and small things that moved? Another object of the same kind (another chair, another door, another plant) is NOT the same spot. Answer only with JSON: {\"same\": true or false, \"tip\": \"one short friendly hint in Dutch for the children, at most 15 words, that does not give away the spot\"}" },
    pic(await small(refId)), pic(await small(id)) ] }] } });
  const c = j.choices?.[0]?.message?.content, txt = typeof c==="string" ? c : (c||[]).map(p=>p.text||"").join("");
  aiLog.push(`antwoord: ${txt.slice(0,300)}`);
  try{ const r = JSON.parse(txt.match(/\{[\s\S]*\}/)[0]); return { same: r.same===true || r.same==="true", tip: String(r.tip||"") }; }
  catch(_){ return { same: /^\W*(yes|ja|true)\b/i.test(txt), tip:"" }; }
}

const BANDS = [{ upto:.12, t:"❄️ IJskoud" }, { upto:.35, t:"🥶 Koud" }, { upto:.6, t:"🙂 Lauw" }, { upto:.88, t:"♨️ Warm!" }, { upto:Infinity, t:"🔥 HEET! Maak nu de foto!" }];
const hunt = { running:false, warm:0, band:0 };
const clamp01 = v => Math.max(0, Math.min(1, v));
// 0 = nothing alike, 1 = enough to pass. Similar colours (the right room) only count for a little.
const warmth = (m, s) => Math.max(clamp01((m.inliers-4)/(passFor(s)-4)), clamp01((m.colour-.5)/.35)*.3);
function showWarmth(w){
  hunt.warm = hunt.warm*.55 + w*.45;
  const band = BANDS.findIndex(b=>hunt.warm < b.upto);
  if (band > hunt.band) tick(band>=3);
  hunt.band = band;
  const cover = document.getElementById("meterCover"), txt = document.getElementById("meterTxt");
  if (cover) cover.style.width = `${100 - hunt.warm*100}%`;
  if (txt) txt.textContent = BANDS[band].t;
  app.querySelector("[data-act=huntSnap]")?.classList.toggle("pulse", band===BANDS.length-1);
}
// Runs while a viewfinder of a "Zoek deze plek" step is on screen: compares a small camera frame with the photo a few times a second.
function huntLoop(){
  if (hunt.running) return; hunt.running = true;
  (async function go(){
    const v = document.getElementById("vf"), s = cfg.steps[prog.index];
    if (!v || prog.phase!=="clue" || !s || kind(s)!=="match"){ hunt.running = false; return; }
    if (v.videoWidth && !ui.overlay && !ui.busy && !cam.busy && document.visibilityState==="visible"){
      try{ showWarmth(warmth(Match.match(await refFeat(s.photo), Match.features(v, 320)), s)); }catch(e){ console.warn(e); }
    }
    setTimeout(go, 150);
  })();
}
async function huntSnap(){
  const v = document.getElementById("vf");
  if (!v || !v.videoWidth || cam.busy) return;
  cam.busy = true; tick(true); document.getElementById("flash")?.classList.add("go");
  const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext("2d").drawImage(v, 0, 0); // not mirrored: compare the room as it really is
  await sleep(250);
  let id;
  try{ id = await storeImage(await toBlob(c), "k-", false); }
  catch(err){ cam.busy = false; ui.msg = "Dat lukte niet. Probeer het nog een keer."; return render(); }
  cam.busy = false; checkSpot(id);
}
async function checkSpot(id){
  const s = cfg.steps[prog.index], sub = prog.sub;
  ui.busy = "Even kijken of dit de goede plek is…"; render();
  let m = { inliers:0, colour:0 }, tip = "", note = "";
  try{ m = await photoMatch(s.photo, id); }catch(e){ console.warn(e); }
  let ok = m.inliers >= passFor(s);
  if (!ok && aiVerifyReady()){
    ui.busy = "Twijfel… de detective-computer kijkt mee 🔎"; render();
    try{ const r = await aiSameSpot(s.photo, id); ok = r.same; tip = r.tip; }
    catch(e){ console.warn(e); note = " (De AI kon niet meekijken.)"; }
  }
  ui.busy = "";
  if (ok){ prog.photos.push({ id, orig:id }); hunt.warm = 0; hunt.band = 0; ui.ghost = false; saveProg(); return solveStep(); }
  dropImage(id); sub.tries = (sub.tries||0) + 1; saveProg(); beep(false);
  ui.msg = (tip || (warmth(m, s) > .5 ? "Bijna! Jullie zijn dichtbij. Fotografeer precies hetzelfde stukje als op de tekening."
    : "Dit is niet de goede plek. Kijk nog eens goed naar de tekening!")) + note;
  render();
}
// Parents can always approve a spot (sum or PIN, like the settings menu), so a picky check never blocks the party.
function approveOverlay(msg=""){
  const pin = lock.mode==="pin" && lock.hash;
  if (!pin) ui.approveQ = hardSum();
  ui.overlay = `<div class="overlay" role="dialog" aria-modal="true" aria-label="Ouders keuren goed"><div class="paper stack"><span class="tape"></span>
    <h2>Alleen voor ouders</h2>

    <form id="approveForm" class="stack" style="gap:10px" autocomplete="off">

    <button class="btn ghost" data-act="closeOverlay">Annuleer</button></div></div>`;

}

/* ---------- confetti ---------- */
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=document.getElementById("confetti"); c.hidden=false;
  const ctx=c.getContext("2d"); const W=c.width=innerWidth, H=c.height=innerHeight;
  const cols=["#c42f28","#f4d43c","#2d8549","#e9d29c","#4aa3c7","#fdf8ea"];
  const ps=Array.from({length:160},()=>({x:Math.random()*W,y:-20-Math.random()*H*.5,r:4+Math.random()*6,c:cols[Math.random()*cols.length|0],vy:2+Math.random()*3,vx:-1.5+Math.random()*3,a:Math.random()*6,va:-.2+Math.random()*.4}));
  let t=0;(function f(){ctx.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore();});
    if(++t<240) requestAnimationFrame(f); else {ctx.clearRect(0,0,W,H); c.hidden=true;}})();
}

/* ---------- fullscreen ---------- */
// Requested on the first tap (browsers only allow it from a tap) and re-requested on a later tap if something
// like the camera picker kicked us out. iPhone Safari has no fullscreen API: there "Zet op beginscherm" is the way.
const root = document.documentElement;
const canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
const fsLabel = () => isFs() ? "Klein scherm" : "⛶ Volledig scherm";
function goFull(){ try{ (root.requestFullscreen||root.webkitRequestFullscreen).call(root)?.catch?.(()=>{}); }catch(e){} }
function exitFull(){ try{ (document.exitFullscreen||document.webkitExitFullscreen).call(document)?.catch?.(()=>{}); }catch(e){} }
["fullscreenchange","webkitfullscreenchange"].forEach(ev=>document.addEventListener(ev, ()=>{ document.querySelectorAll("[data-act=fullscreen]").forEach(b=>b.textContent=fsLabel()); }));

/* ---------- wake lock ---------- */
// The lock is dropped whenever the page is hidden, so it's re-requested on return and on any tap (some browsers need one).
let wakeLock = null;
async function keepAwake(){
  if (!navigator.wakeLock || (wakeLock && !wakeLock.released) || document.visibilityState!=="visible") return;
  try{ wakeLock = await navigator.wakeLock.request("screen"); }catch(e){}
}
document.addEventListener("visibilitychange", keepAwake);
document.addEventListener("pointerdown", keepAwake, true);
keepAwake();

/* ---------- screens ---------- */
function folder(tab, inner){
  const [a, ...rest] = tab.split(" · ");
  const label = `<span class="tl-a">${esc(a)}</span>${rest.length ? `<span class="tl-b">&nbsp;· ${esc(rest.join(" · "))}</span>` : ""}`;
  return `<div class="folder"><span class="tab-label" title="${esc(tab)}">${label}</span><div class="stack">${inner}</div></div>`;
}

// Photo steps without a photo on this device (e.g. after importing settings) fall back to a plain riddle + code.
const kind = s => { const t = s.type||"code"; return (t==="photo"||t==="jigsaw") && !imgs.has(s.photo) ? "code" : t; };
const ZOOMS = [3.2, 2.2, 1.5, 1];

function evidenceList(upto){
  const items = cfg.steps.slice(0, upto).map((s,i)=>s.evidence ? `<li><span class="nr">#${i+1}</span><span>${esc(s.evidence)}</span></li>` : "").join("");
  return items ? `<div class="stack" style="gap:10px"><p class="type muted">BEWIJSSTUKKEN</p><ul class="evidence">${items}</ul></div>` : "";
}

function album(){
  const ps = prog.photos.filter(p=>imgs.has(p.id));

}

const codeForm = () => `
  <form id="codeForm" class="stack" style="gap:10px" autocomplete="off">
    <label class="lbl" for="code">Gevonden? Typ de geheime code van het briefje:</label>

    <button class="btn" type="submit">Controleer code</button>
    <p class="msg bad" id="msg" aria-live="polite">${esc(ui.msg)}</p>
  </form>`;

function renderClue(){
  const i = prog.index, s = cfg.steps[i], n = cfg.steps.length, k = kind(s), sub = prog.sub;
  const dots = cfg.steps.map((_,j)=>`<span class="dot ${j<i?"done":j===i?"now":""}"></span>`).join("");
  const label = { code:"AANWIJZING", photo:"WAAR IS DIT?", jigsaw:"FOTOPUZZEL", scramble:"LETTERPUZZEL", camera:"FOTO-OPDRACHT", match:"FOTOJACHT" }[k];
  let text = clueText(s, k), slot = `clue${i}`;
  // selfies for photo assignments, the back camera for finding a spot (once per step, so "Andere camera" sticks)
  if ((k==="camera" || k==="match") && ui.camStep!==i){ ui.camStep = i; const want = k==="match" ? "environment" : "user";
    if (cam.facing!==want){ cam.facing = want; camStop(); } }
  let extra = "", after = "";
  const hint = ui.hintShown ? `<div class="hint-box"><b>Tip:</b> ${esc(s.hint)}</div>`
    : (s.hint ? `<button class="btn ghost" data-act="hint">We komen er niet uit… geef een tip</button>` : "");

  if (k==="code") after = hint + codeForm();
  if (k==="photo"){
    extra = `<div class="zoom"><img src="${imgs.get(s.photo)}" alt="Ingezoomde foto van de verstopplek" style="transform:scale(${ZOOMS[ui.zoom]})"></div>`;
    after = (ui.zoom < ZOOMS.length-1 ? `<button class="btn alt" data-act="zoomOut">🔍 Zoom een beetje uit</button>` : "") + hint + codeForm();
  }
  if (k==="jigsaw"){
    const { c, r } = jigSize(s), n = c*r;
    if (sub.order?.length!==n){ sub.order = scrambled([...Array(n).keys()], o=>o.every((v,j)=>v===j)); sub.sel = null; saveProg(); }
    if (sub.solved){
      text = JIG_DONE; slot = `jig${i}`;
      extra = `<img class="full" src="${imgs.get(s.photo)}" alt="De verstopplek">`;
      after = hint + codeForm();
    } else {
      extra = `<div class="jig" style="--c:${c};--r:${r}">${sub.order.map((pc,pos)=>`<button data-act="tile" data-p="${pos}" class="${sub.sel===pos?"sel":""}" aria-label="Puzzelstukje ${pos+1}"
        style="background-image:url(${imgs.get(s.photo)});background-position:${(pc%c)*100/(c-1)}% ${Math.floor(pc/c)*100/(r-1)}%"></button>`).join("")}</div>`;
      after = hint;
    }
  }
  if (k==="scramble"){
    const word = norm(s.code);
    if (!sub.tiles || sub.tiles.length!==word.length){ sub.tiles = scrambled([...word].map((_,j)=>j), r=>r.map(j=>word[j]).join("")===word); sub.picked=[]; saveProg(); }
    const picked = sub.picked || [];
    extra = `<div class="slots" aria-label="Jullie woord">${[...word].map((_,j)=>`<span class="slot">${picked[j]!=null?word[sub.tiles[picked[j]]]:""}</span>`).join("")}</div>`;
    after = `<div class="letters">${sub.tiles.map((li,p)=>`<button class="tile" data-act="letter" data-p="${p}" ${picked.includes(p)?"disabled":""}>${word[li]}</button>`).join("")}</div>
      <button class="btn alt small" data-act="unletter" ${picked.length?"":"disabled"}>⌫ Letter terug</button>
      <p class="msg bad" aria-live="polite">${esc(ui.msg)}</p>` + hint;
  }
  if (k==="match" && !imgs.has(s.photo)){ // e.g. settings copied from another device without the photo
    text = `${text}\n\n(De foto van deze plek staat niet op dit apparaat.)`;
    after = `<button class="btn" data-act="skipStep">Sla deze opdracht over</button>`;
  }
  else if (k==="match" && !sub.go){ // first the question on its own, then the drawing and the camera together
    after = `<button class="btn" data-act="huntGo">🔍 Zoeken maar!</button>`;
  }
  else if (k==="match"){
    text = ""; slot = "";
    const pic = imgs.get(s.showPhoto ? s.photo : (imgs.has(s.sketch) ? s.sketch : s.photo));
    extra = `<img class="full ${s.showPhoto ? "" : "sketch"}" src="${pic}" alt="${s.showPhoto ? "Foto" : "Tekening"} van de plek die jullie moeten vinden">`;
    const tail = `<p class="msg bad" aria-live="polite">${esc(ui.msg)}</p>${hint}
      <button class="btn ghost" data-act="huntBack">📜 Lees de vraag nog eens</button>
      <button class="btn ghost" data-act="approve">Ouders: plek goedkeuren</button>`;
    if (ui.busy) after = `<div class="busy"><span class="glass">🔍</span><p>${esc(ui.busy)}</p></div>`;
    else if (camOk()) after = `<div class="viewfinder hunt"><video id="vf" class="${cam.facing==="user"?"mirror":""}" playsinline muted autoplay></video>
        ${ui.ghost ? `<img class="ghost" src="${pic}" alt="">` : ""}<div class="flash" id="flash"></div>
        <div class="meter"><div class="meter-track" role="img" aria-label="Warm of koud"><span id="meterCover" style="width:${100-hunt.warm*100}%"></span></div>
          <p class="meter-txt" id="meterTxt" aria-live="polite">${BANDS[hunt.band].t}</p></div></div>
      <button class="btn" data-act="huntSnap">📸 Is het hier?</button>
      <div class="row"><button class="btn alt small" data-act="flip">🔄 Andere camera</button>
        ${(sub.tries||0) >= 2 ? `<button class="btn alt small" data-act="ghost">👻 ${ui.ghost ? "Spiekplaatje weg" : "Spiekplaatje"}</button>` : ""}</div>` + tail;
    else after = `<label class="btn">📷 Maak de foto<input type="file" accept="image/*" capture="environment" class="vh" id="huntFile"></label>` + tail;
  }
  if (k==="camera"){
    const shown = sub.styled || sub.photo;
    const camBtn = (txt, cls) => `<label class="btn ${cls}">${txt}<input type="file" accept="image/*" capture="${cam.facing}" class="vh" id="cam"></label>`;
    if (ui.busy) after = `<div class="busy"><span class="glass">🔍</span><p>${esc(ui.busy)}</p></div>`;
    else if (!shown && camOk()){
      extra = `<div class="viewfinder"><video id="vf" class="${cam.facing==="user"?"mirror":""}" playsinline muted autoplay></video>
        <div class="count" id="count" aria-live="assertive"></div><div class="flash" id="flash"></div></div>`;
      after = `<div class="row"><button class="btn" data-act="snap">📸 Klik!</button><button class="btn alt" data-act="timer">⏱ Aftellen 3-2-1</button></div>
        <button class="btn ghost" data-act="flip">🔄 Andere camera</button>
        <p class="msg bad" aria-live="polite">${esc(ui.msg)}</p>`;
    }
    else if (!shown) after = camBtn("📷 Maak de foto", "") + `<p class="msg bad" aria-live="polite">${esc(ui.msg)}</p>`;
    else {
      extra = `<img class="full" src="${imgs.get(shown)}" alt="Jullie foto">`;
      const offer = s.ai && !sub.styled;
      after = `${offer && ui.aiError ? `<div class="hint-box"><b>De AI-tekenaar lukte niet.</b><br>${esc(ui.aiError)}
            ${ui.aiLog?.length ? `<details style="margin-top:6px"><summary>Technische details</summary><pre class="ailog">${esc(ui.aiLog.join("\n"))}</pre></details>` : ""}</div>
          <div class="row"><button class="btn" data-act="detectify">Opnieuw tekenen</button><button class="btn alt" data-act="detectLocal">Maak een dossierfoto</button></div>`
        : offer ? `<button class="btn" data-act="detectify">✨ Maak er detectives van!</button>
          <p class="muted" style="font-size:14px;text-align:center">${aiReady() ? `Getekend door ${esc(PROVIDERS[ai.provider]?.name || "AI")} (${esc(ai.model)})` : "Zonder AI: er is geen sleutel ingesteld bij Ouders"}</p>` : ""}
        <button class="btn ${s.ai && !sub.styled ? "alt" : ""}" data-act="usePhoto">${sub.styled ? "Super! Stop hem in het dossier" : "Deze foto is goed"}</button>
        ${sub.styled ? `<button class="btn ghost" data-act="unstyle">Toch de gewone foto</button>` : ""}
        <button class="btn alt small" data-act="retake">Nieuwe foto maken</button>
        <p class="msg bad" aria-live="polite">${esc(ui.msg)}</p>`;
    }
  }

  return folder(`${(prog.team||"DETECTIVES").toUpperCase()} · STAP ${i+1}/${n}`, `
    <div class="progress" aria-label="Stap ${i+1} van ${n}">${dots}</div>
    <div class="paper ${k==="match" && sub.go ? "hunt" : ""}"><span class="tape"></span>
      <p class="type muted" style="margin-bottom:8px">${label} ${i+1}</p>
      ${text ? `<p class="riddle">${esc(text)}</p>` : ""}
      ${extra}
      ${slot ? sayBtn(slot) : ""}
    </div>
    ${after}
    ${evidenceList(i)}
  `);
}

}

function render(){
  let html;
  if (ui.view==="gate") html = renderGate();
  else if (ui.view==="setup") html = renderSetup();
  else if (prog.phase==="clue") html = renderClue();
  else if (prog.phase==="accuse") html = renderAccuse();
  else if (prog.phase==="solved") html = renderSolved();
  else html = renderStart();
  if (!ui.view) html += `<div class="corner">${canFs ? `<button class="fs-btn" data-act="fullscreen">${fsLabel()}</button>` : ""}<button class="parents" data-act="openSetup">Ouders</button></div>`;
  if (ui.overlay) html += ui.overlay;
  app.innerHTML = html;
  camAttach();
  if (document.getElementById("vf") && kind(cfg.steps[prog.index]||{})==="match") huntLoop();
  const slot = autoSlot();
  if (slot === undefined) hush();
  else if (slot !== ui.spoken){ ui.spoken = slot; slot ? say(slot) : hush(); }
  const ci = document.getElementById("code");
  if (ci && !ui.overlay && kind(cfg.steps[prog.index]||{})==="code") ci.focus({preventScroll:true});
}

function collectSetup(){
  cfg.title = document.getElementById("s-title").value.trim() || DEFAULT.title;
  cfg.story = document.getElementById("s-story").value.trim();
  document.querySelectorAll(".step-edit").forEach(el=>{
    const i=+el.dataset.i;
    el.querySelectorAll("[data-f]").forEach(f=>{ cfg.steps[i][f.dataset.f] = f.type==="checkbox" ? f.checked : f.value.trim(); });
  });
  const sus = document.getElementById("s-suspects").value.split(",").map(s=>s.trim()).filter(Boolean);
  cfg.suspects = sus.length>=2 ? sus : cfg.suspects;
  cfg.culpritIndex = Math.min(+document.getElementById("s-culprit").value||0, cfg.suspects.length-1);
  cfg.finalHide = document.getElementById("s-final").value.trim();
  collectAi(); collectTts();
}

function collectTts(){
  const val = id => document.getElementById(id)?.value.trim();
  tts.on = !!document.getElementById("tts-on")?.checked;
  if (!document.getElementById("tts-base")) return;
  tts.keys = { ...tts.keys, [tts.provider]: val("tts-key") };
  tts.base = val("tts-base"); tts.model = val("tts-model"); tts.voice = val("tts-voice");
  if (document.getElementById("tts-style")) tts.style = val("tts-style");
}

function collectAi(){
  ai.keys = { ...ai.keys, [ai.provider]: document.getElementById("ai-key").value.trim() };
  ai.base = document.getElementById("ai-base").value.trim();
  ai.style = document.getElementById("ai-style").value;
  ai.model = document.getElementById("ai-model").value.trim();
  ai.prompt = document.getElementById("ai-prompt").value.trim() || AI_DEFAULT.prompt;
  ai.visionModel = document.getElementById("ai-vision").value.trim();
  ai.verify = document.getElementById("ai-verify").checked;
}
const aiReady = () => !!(aiKey() && ai.base && ai.model);
const aiStatus = () => aiReady() ? `✓ Ingesteld: ${PROVIDERS[ai.provider]?.name || ai.base} · ${ai.model}. Wordt meteen bewaard.`
  : "Nog geen sleutel: “Maak er detectives van” bewerkt de foto op het apparaat zelf.";
const aiMsg = t => { const m=document.getElementById("aiMsg"); if(m) m.textContent=t; };

function stepProblem(s){
  const t = s.type||"code";
  if (t==="camera") return s.clue ? "" : "mist nog een opdracht";
  if (t==="scramble") return norm(s.code).length>=2 ? "" : "mist nog een woord om te puzzelen";
  if ((t==="photo"||t==="jigsaw"||t==="match") && !imgs.has(s.photo)) return "mist nog een foto";
  if (t==="match") return "";
  if (!norm(s.code)) return "mist nog een code";
  return t==="code" && !s.clue ? "mist nog een raadsel" : "";
}

function setupMsg(t){ ui.msg=t; const m=document.getElementById("setupMsg"); if(m) m.textContent=t; }

function newProg(team, phase){
  prog.photos.forEach(p=>{ dropImage(p.id); if(p.orig!==p.id) dropImage(p.orig); });
  dropImage(prog.sub.photo); dropImage(prog.sub.styled);
  return { team, index:0, phase, wrongSuspects:[], sub:{}, photos:[] };
}

function solveStep(){
  const s = cfg.steps[prog.index], k = kind(s), last = prog.index===cfg.steps.length-1;
  beep(true); confetti();
  const stamp = { scramble:"PUZZEL OPGELOST!", camera:"FOTO IN HET DOSSIER!", match:"PLEK GEVONDEN!" }[k] || "CODE GOED!";
  ui.overlaySlot = s.evidence ? `ev${prog.index}` : "";
  ui.overlay = `<div class="overlay" role="dialog" aria-modal="true" aria-label="${stamp}"><div class="paper stack"><span class="tape"></span>
    <span class="stamp" style="color:var(--good);border-color:var(--good)">${stamp}</span>
    ${s.evidence ? `<p class="type muted">BEWIJSSTUK #${prog.index+1}</p><p class="riddle" style="font-size:20px">${esc(s.evidence)}</p>${sayBtn(`ev${prog.index}`)}` : ""}
    <button class="btn" data-act="next">${last?"Naar de ontknoping":"Volgende opdracht"}</button></div></div>`;
  render(); app.querySelector(".overlay .btn")?.focus();
}

// Before the game starts, every line that isn't stored yet is spoken (with a progress screen).
async function voiceFirst(act, team){
  if (!ttsReady() || ui.skipVoice) return true;
  const box = inner => { ui.overlaySlot = ""; ui.overlay = `<div class="overlay" role="dialog" aria-modal="true" aria-label="De stem wordt ingesproken">
    <div class="paper stack"><span class="tape"></span>${inner}</div></div>`; render(); };
  ui.prepTeam = team;
  try{
    await prepareSpeech(team, (d,n)=>{ if (!n) return; const t = `De verteller leest de dossiers door… ${d} van ${n}`, m = document.getElementById("prepMsg");
      m ? (m.textContent = t) : box(`<div class="busy"><span class="glass">🎙</span><p id="prepMsg">${esc(t)}</p></div>`); });
    ui.overlay = null; return true;
  }catch(err){
    box(`<p><b>Het inspreken van de stem lukte niet.</b></p><p class="muted" style="font-size:15px">${esc(err.message||String(err))}</p>
      <div class="row"><button class="btn" data-act="${act}">Opnieuw proberen</button><button class="btn alt" data-act="skipVoice" data-then="${act}">Start zonder stem</button></div>`);
    return false;
  }
}
async function enterGame(act, team){
  if (ui.entering) return;
  ui.entering = true;
  try{ if (!(await voiceFirst(act, team))) return; }
  finally{ ui.entering = false; }
  if (act==="begin"){ prog = newProg(team, "clue"); ui.hintShown=false; ui.zoom=0; }
  else { prog.team = team; if (prog.phase==="start") prog.phase="clue"; }
  keepAwake(); saveProg(); render(); if (act==="begin") scrollTo(0,0);
}

/* ---------- photo puzzle: tap two pieces to swap them, or drag one onto another ---------- */
function swapTiles(a, b){
  const sub = prog.sub;
  [sub.order[a], sub.order[b]] = [sub.order[b], sub.order[a]]; sub.sel = null;
  if (sub.order.every((v,j)=>v===j)){ sub.solved = true; beep(true); confetti(); }
  saveProg(); render();
}
let drag = null, dragged = false; // drag: { el, p, x, y, on, over }; dragged: the next click ends a drag, it is not a tap
app.addEventListener("pointerdown", e=>{
  dragged = false;
  const el = e.target.closest(".jig [data-act=tile]");
  if (!el || !e.isPrimary || e.button>0) return;
  drag = { el, p:+el.dataset.p, x:e.clientX, y:e.clientY, on:false, over:null };
  el.setPointerCapture(e.pointerId);
});
app.addEventListener("pointermove", e=>{
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.on && Math.hypot(dx, dy) < 8) return; // a small wobble is still a tap
  drag.on = true; drag.el.classList.add("drag");
  drag.el.style.transform = `translate(${dx}px,${dy}px) scale(.85)`;
  const under = document.elementsFromPoint(e.clientX, e.clientY).find(t=>t!==drag.el && t.matches(".jig [data-act=tile]")) || null;
  if (under !== drag.over){ drag.over?.classList.remove("over"); under?.classList.add("over"); drag.over = under; }
});
const endDrag = e=>{
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.on) return; // a tap: the click handler swaps
  dragged = true;
  if (e.type==="pointerup" && d.over) swapTiles(d.p, +d.over.dataset.p);
  else { d.el.classList.remove("drag"); d.el.style.transform = ""; d.over?.classList.remove("over"); }
};
app.addEventListener("pointerup", endDrag);
app.addEventListener("pointercancel", endDrag);

/* ---------- events ---------- */
app.addEventListener("click", async e=>{
  const b = e.target.closest("[data-act]"), act = b?.dataset.act;
  if(act==="begin" || act==="resume") ui.wantFs = true;
  if(ui.wantFs && canFs && !isFs() && act!=="fullscreen" && !e.target.closest("label")) goFull();
  if(!b) return;
  const i=+b.dataset.i, sub=prog.sub;
  ui.msg="";
  switch(act){
    case "begin": case "resume":
      if (act==="begin") beep(true); else getAudio(); // the voice needs the sound unlocked by this tap
      enterGame(act, (document.getElementById("team")?.value||prog.team||"").trim()); break;
    case "skipVoice": ui.skipVoice=true; ui.overlay=null; enterGame(b.dataset.then, ui.prepTeam||""); break;
    case "restart":
      if (prog.phase!=="start" && !b.dataset.sure){ b.dataset.sure="1"; b.textContent="Zeker weten? Tik nog een keer"; return; }
      prog = newProg((document.getElementById("team")?.value||prog.team||"").trim(), "start");
      ui.hintShown=false; ui.zoom=0; saveProg(); render(); scrollTo(0,0); break;
    case "huntGo": prog.sub.go = true; saveProg(); render(); scrollTo(0,0); break;
    case "huntBack": prog.sub.go = false; saveProg(); render(); scrollTo(0,0); break;
    case "hint": ui.hintShown=true; render(); say(`hint${prog.index}`); break;
    case "say": getAudio(); say(b.dataset.slot); break;
    case "zoomOut": ui.zoom=Math.min(ui.zoom+1, ZOOMS.length-1); render(); break;
    case "tile": {
      if (dragged) break;
      const p=+b.dataset.p;
      if(sub.sel==null || sub.sel===p){ sub.sel = sub.sel===p ? null : p; saveProg(); render(); }
      else swapTiles(sub.sel, p);
      break; }
    case "letter": {
      const s=cfg.steps[prog.index], word=norm(s.code);
      sub.picked=[...(sub.picked||[]), +b.dataset.p];
      if(sub.picked.length===word.length){
        const guess=sub.picked.map(p=>word[sub.tiles[p]]).join(""); sub.picked=[]; saveProg();
        if(guess===word) return solveStep();
        beep(false); ui.msg=`“${guess}” is het niet. Probeer het nog een keer!`;
      }
      saveProg(); render(); break; }
    case "unletter": sub.picked=(sub.picked||[]).slice(0,-1); saveProg(); render(); break;
    case "detectify": case "detectLocal": {
      const useAi = act==="detectify" && aiReady(); ui.aiError="";
      ui.busy = useAi ? `De tekenaar van het detectivebureau (${PROVIDERS[ai.provider]?.name || "AI"}) is aan het werk… dit duurt ongeveer een minuut.` : "Even ontwikkelen…";
      render();
      try{ sub.styled = useAi ? await aiDetective(sub.photo) : await localDetective(sub.photo); }
      catch(err){ console.warn(err); if(useAi){ ui.aiError = err.message || String(err); ui.aiLog = err.log; } else ui.msg = "Dat lukte niet. Gebruik gewoon de gewone foto!"; }
      ui.busy=""; saveProg(); render(); break; }
    case "snap": case "timer": camSnap(act==="timer"); break;
    case "huntSnap": huntSnap(); break;
    case "ghost": ui.ghost = !ui.ghost; render(); break;
    case "approve": approveOverlay(); break;
    case "closeOverlay": ui.overlay=null; render(); break;
    case "skipStep": solveStep(); break;
    case "flip": cam.facing = cam.facing==="user" ? "environment" : "user"; camStop(); render(); break;
    case "retake": ui.aiError=""; dropImage(sub.photo); dropImage(sub.styled); prog.sub={}; saveProg(); render(); break;
    case "unstyle": dropImage(sub.styled); delete sub.styled; saveProg(); render(); break;
    case "usePhoto":
      prog.photos.push({ id: sub.styled||sub.photo, orig: sub.photo }); prog.sub={}; saveProg(); solveStep(); break;
    case "next":
      ui.overlay=null; ui.overlaySlot=null; ui.hintShown=false; ui.zoom=0; ui.aiError=""; ui.ghost=false; hunt.warm=0; hunt.band=0; prog.sub={};
      prog.index++; prog.phase = prog.index>=cfg.steps.length ? "accuse" : "clue";
      saveProg(); render(); scrollTo(0,0); break;
    case "accuse": {
      const k=+b.dataset.k;
      if(k===cfg.culpritIndex){ prog.phase="solved"; saveProg(); beep(true); render(); confetti(); scrollTo(0,0); }
      else { prog.wrongSuspects.push(k); saveProg(); beep(false); ui.msg=MSG.wrongSuspect; render(); say("wrongSuspect", .35); }
      break; }
    case "party": beep(true); confetti(); break;
    case "loadModels":
      collectAi(); if(!ai.base) return aiMsg("Vul eerst het adres in."); aiMsg("Modellen ophalen…");
      try{ const ms = await fetchModels(); if(!ms.length) throw new Error("Geen modellen gevonden");
        ai.models = ms; save(KEY_AI, ai); collectSetup(); render(); aiMsg(`${ms.length} modellen gevonden.`); }
      catch(err){ aiMsg(`Ophalen lukte niet: ${err.message}`); }
      break;
    case "testAi": {
      collectAi(); save(KEY_AI, ai);
      const box = document.getElementById("aiTest");
      if(!aiReady()){ aiMsg("Vul eerst een sleutel, adres en model in."); break; }
      box.innerHTML = `<div class="busy"><span class="glass">🔍</span><p>Testplaatje wordt getekend… dit duurt ongeveer een minuut.</p></div>`;
      // a small made-up "team photo", so the test doesn't need the camera
      const c = document.createElement("canvas"); c.width = 640; c.height = 480; const x = c.getContext("2d");
      x.fillStyle = "#9fd3ee"; x.fillRect(0,0,640,480); x.fillStyle = "#6bbf59"; x.fillRect(0,360,640,120);
      [[200,"#f2c29b"],[320,"#c68a5e"],[440,"#f7d7b5"]].forEach(([cx,skin])=>{ x.fillStyle="#d9534f"; x.fillRect(cx-45,250,90,140);
        x.fillStyle=skin; x.beginPath(); x.arc(cx,210,45,0,7); x.fill(); x.fillStyle="#222"; x.fillRect(cx-18,200,8,8); x.fillRect(cx+10,200,8,8); });
      const inId = await keepBlob(await toBlob(c), "t-");
      try{
        const outId = await aiDetective(inId);
        box.innerHTML = `<p class="msg">✓ Het werkt!</p><img class="full" src="${imgs.get(outId)}" alt="Testplaatje"><pre class="ailog">${esc(aiLog.join("\n"))}</pre>`;
      }catch(err){
        box.innerHTML = `<div class="hint-box"><b>Dat lukte niet.</b><br>${esc(err.message||String(err))}<pre class="ailog">${esc((err.log||[]).join("\n"))}</pre></div>`;
      }
      dropImage(inId); break; }
    case "loadVoices":
      collectTts(); save(KEY_TTS, tts); if(!tts.base) return ttsMsg("Vul eerst het adres in."); ttsMsg("Stemmen ophalen…");
      try{ const vs = await fetchVoices(); if(!vs.length) throw new Error("Geen stemmen gevonden");
        tts.voices = vs; save(KEY_TTS, tts); collectSetup(); render(); ttsMsg(`${vs.length} stemmen gevonden. Kies er een.`); }
      catch(err){ ttsMsg(`Ophalen lukte niet: ${err.message}`); }
      break;
    case "testVoice":
      collectTts(); save(KEY_TTS, tts); getAudio();
      if(!ttsReady()) return ttsMsg("Vul eerst een sleutel, adres, model en stem in.");
      ttsMsg("Even inspreken…");
      try{ if (!(await playBlob(null, await synth(`Hallo detectives! Ik ben de verteller van ${cfg.title}. Zijn jullie er klaar voor?`)))) throw new Error("het geluid kon niet afgespeeld worden.");
        ttsMsg("✓ Hoor je de stem? Dan werkt het."); }
      catch(err){ ttsMsg(`Dat lukte niet: ${err.message}`); }
      break;
    case "typeVoice": collectSetup(); tts.voices=[]; save(KEY_TTS, tts); render(); document.getElementById("tts-voice")?.focus(); break;
    case "prepVoice":
      collectSetup(); save(KEY_TTS, tts);
      if(!ttsReady()) return ttsMsg("Vul eerst een sleutel, adres, model en stem in.");
      b.disabled = true;
      try{ await prepareSpeech(prog.team, (d,n)=>ttsMsg(n ? `Inspreken… ${d} van ${n}` : "")); gcClips(prog.team); ttsMsg(ttsStatus()); }
      catch(err){ ttsMsg(`Inspreken lukte niet: ${err.message}`); }
      b.disabled = false; break;
    case "typeModel": collectSetup(); ai.models=[]; render(); document.getElementById("ai-model")?.focus(); break;
    case "fullscreen": ui.wantFs = !isFs(); ui.wantFs ? goFull() : exitFull(); break;
    case "openSetup": ui.view="gate"; ui.gateQ=null; ui.recover=false; render(); scrollTo(0,0); document.getElementById("gate")?.focus(); break;
    case "back": ui.view=null; ui.recover=false; ui.recovered=false; ui.lockDraft=null; render(); scrollTo(0,0); break;
    case "forgotPin": ui.recover=true; ui.gateQ=null; render(); break;
    case "saveLock": {
      const mode=document.getElementById("lock-mode").value, msg=t=>{ const m=document.getElementById("lockMsg"); if(m) m.textContent=t; };
      if(mode==="math"){ lock={ mode:"math" }; save(KEY_LOCK, lock); ui.lockDraft=null; return msg("Opgeslagen: er wordt een rekensom gevraagd."); }
      const p1=document.getElementById("pin1").value.trim(), p2=document.getElementById("pin2").value.trim();
      if(!p1 && !p2 && lock.mode==="pin" && lock.hash) return msg("De pincode blijft hetzelfde.");
      if(!/^\d{4,8}$/.test(p1)) return msg("Kies een pincode van 4 tot 8 cijfers.");
      if(p1!==p2) return msg("De twee pincodes zijn niet hetzelfde.");
      const salt=Math.random().toString(36).slice(2);
      lock={ mode:"pin", salt, hash: await hashPin(p1, salt) }; save(KEY_LOCK, lock); ui.lockDraft=null; ui.recovered=false;
      document.getElementById("pin1").value=document.getElementById("pin2").value="";
      msg("Pincode opgeslagen. Die wordt voortaan elke keer gevraagd."); break; }
    case "tab": collectSetup(); ui.setupTab=b.dataset.tab; render(); scrollTo(0,0); break;
    case "toggleStep": { // fold in place, so nothing typed gets lost
      const el=b.closest(".step-edit"), st=cfg.steps[+el.dataset.i], open=!openSteps.has(st);
      open ? openSteps.add(st) : openSteps.delete(st);
      el.classList.toggle("closed", !open); document.getElementById(b.getAttribute("aria-controls")).hidden=!open;
      b.setAttribute("aria-expanded", open); b.querySelector("b").textContent = b.querySelector("b").textContent.replace(/^[▸▾]/, open?"▾":"▸");
      break; }
    case "openAll": collectSetup(); cfg.steps.forEach(st=>openSteps.add(st)); render(); break;
    case "closeAll": collectSetup(); openSteps=new WeakSet(); render(); break;
    case "add": { collectSetup(); const st={type:"code",clue:"",place:"",code:"",hint:"",evidence:""}; cfg.steps.push(st); openSteps.add(st); render();
      document.querySelector(`.step-edit[data-i="${cfg.steps.length-1}"]`)?.scrollIntoView({block:"start", behavior:"smooth"}); break; }
    case "del":
      if(cfg.steps.length<2) return setupMsg("Er moet minstens één opdracht overblijven.");
      if(!b.dataset.sure){ b.dataset.sure="1"; b.textContent="Zeker?"; return; }
      collectSetup(); cfg.steps.splice(i,1); ui.matchInfo={}; render(); break;
    case "saveSetup": {
      collectSetup(); save(KEY_AI, ai); save(KEY_TTS, tts);
      const bad = cfg.steps.findIndex(s=>stepProblem(s));
      if(bad>=0){ ui.setupTab="steps"; openSteps.add(cfg.steps[bad]); render(); setupMsg(`Stap ${bad+1} ${stepProblem(cfg.steps[bad])}.`);
        document.querySelector(`.step-edit[data-i="${bad}"]`)?.scrollIntoView({block:"center"}); return; }
      for (const st of cfg.steps) if (st.type==="match" && imgs.has(st.photo) && !imgs.has(st.sketch)){ // e.g. a "Waar is dit?" photo reused
        setupMsg("Tekening wordt gemaakt…"); try{ st.sketch = await sketchOf(st.photo); }catch(err){} }
      save(KEY_CFG,cfg); gcImages();
      if(prog.index>=cfg.steps.length && prog.phase==="clue"){ prog.index=0; prog.sub={}; saveProg(); }
      render(); setupMsg("Opgeslagen."); break; }
    case "copyJson": {
      const t=document.getElementById("s-json");
      navigator.clipboard?.writeText(t.value).then(()=>setupMsg("Gekopieerd."), ()=>{ t.select(); setupMsg("Tekst is geselecteerd: kopieer hem zelf."); })
        ?? (t.select(), setupMsg("Tekst is geselecteerd: kopieer hem zelf."));
      break; }
    case "importJson":
      try{ const c=JSON.parse(document.getElementById("s-json").value);
        if(!Array.isArray(c.steps)||!c.steps.length||!Array.isArray(c.suspects)) throw 0;
        cfg=Object.assign(structuredClone(DEFAULT), c); save(KEY_CFG,cfg); render(); setupMsg("Instellingen overgenomen. Voeg eventuele foto's opnieuw toe.");
      }catch(err){ setupMsg("Die tekst klopt niet. Kopieer alles opnieuw vanaf het andere apparaat."); }
      break;
    case "resetProg": prog=newProg("","start"); saveProg(); render(); setupMsg("Spel staat weer aan het begin."); break;
    case "resetAll":
      if(!b.dataset.sure){ b.dataset.sure="1"; b.textContent="Zeker? Tik nog een keer"; return; }
      cfg=structuredClone(DEFAULT); save(KEY_CFG,cfg); gcImages(); render(); setupMsg("Voorbeeldtocht hersteld."); break;
  }
});

    collectSetup(); const i=+t.dataset.try, st=cfg.steps[i]; ui.matchInfo[i]="Testfoto wordt bekeken…"; render();
    let id;

      let txt = `Testfoto: ${m.inliers} punten komen overeen (nodig: ${pass}). ${m.inliers>=pass ? "✓ De tablet keurt hem goed." : "✗ De tablet keurt hem af."}`;
      if (aiVerifyReady()){
        try{ const r = await aiSameSpot(st.photo, id); txt += ` AI (${ai.visionModel}): ${r.same ? "✓ zelfde plek" : "✗ andere plek"}${r.tip ? `. Tip: “${r.tip}”` : ""}`; }
        catch(err){ txt += ` De AI lukte niet: ${err.message}`; }
      } else if (m.inliers<pass) txt += " Was dit wél de goede plek? Kies dan ‘Makkelijk’, of zet hieronder de AI aan om te laten meekijken.";
      ui.matchInfo[i] = txt;
    } catch(err){ console.warn(err); ui.matchInfo[i] = "Die testfoto kon niet bekeken worden."; }
    dropImage(id); render(); return;
  }
  if(t.id==="huntFile" && t.files[0]){
    ui.msg=""; let id;

    return checkSpot(id);
  }
  if(t.id==="cam" && t.files[0]){

    try{ const id=await storeImage(file, "k-", false);
      dropImage(prog.sub.photo); dropImage(prog.sub.styled); prog.sub={ photo:id }; saveProg(); }
    catch(err){ ui.msg="Dat lukte niet. Probeer het nog een keer."; }
    ui.busy=""; render();
  }
});

app.addEventListener("submit", e=>{
  e.preventDefault();
  if(e.target.id==="codeForm"){
    const input=document.getElementById("code"), s=cfg.steps[prog.index];
    if(!norm(input.value)) return;
    if(norm(input.value)===norm(s.code)) solveStep();
    else {
      beep(false); input.classList.remove("shake"); void input.offsetWidth; input.classList.add("shake");
      document.getElementById("msg").textContent = MSG.wrongCode; say("wrongCode", .35);
      input.select();
    }
  }
  if(e.target.id==="approveForm") (async()=>{
    const val=document.getElementById("approve").value.trim(), pin = lock.mode==="pin" && lock.hash, m=document.getElementById("approveMsg");
    if(Date.now() < ui.lockUntil){ m.textContent=`Te vaak fout. Wacht ${Math.ceil((ui.lockUntil-Date.now())/1000)} seconden.`; return; }
    const ok = pin ? (await hashPin(val, lock.salt)) === lock.hash : val!=="" && +val === ui.approveQ.a*ui.approveQ.b;
    if(ok){ ui.fails=0; ui.overlay=null; hunt.warm=0; hunt.band=0; ui.ghost=false; return solveStep(); }
    if(++ui.fails % 5 === 0) ui.lockUntil = Date.now() + 30000;
    pin ? (m.textContent="Die pincode klopt niet.") : approveOverlay("Dat is niet goed. Hier is een nieuwe som.");
  })();
  if(e.target.id==="gateForm") (async()=>{
    const val=document.getElementById("gate").value.trim(), pin = lock.mode==="pin" && lock.hash && !ui.recover;
    if(Date.now() < ui.lockUntil){ ui.msg=`Te vaak fout. Wacht ${Math.ceil((ui.lockUntil-Date.now())/1000)} seconden.`; return render(); }
    const ok = pin ? (await hashPin(val, lock.salt)) === lock.hash : val!=="" && +val === ui.gateQ.a*ui.gateQ.b;
    if(ok){ ui.fails=0; ui.recovered=ui.recover; ui.recover=false; ui.view="setup"; ui.msg=""; render(); scrollTo(0,0); }
    else {
      if(++ui.fails % 5 === 0) ui.lockUntil = Date.now() + 30000;
      ui.msg = pin ? "Die pincode klopt niet." : "Dat is niet goed. Hier is een nieuwe som."; ui.gateQ=null; render();
    }
  })();
});

/* ---------- dragging the steps into a new order (pointer events, so it works with a finger as well as a mouse) ---------- */
let stepDrag = null; // { el, grab, y }
function moveSteps(order){ // order = old indexes in their new order
  collectSetup(); // reads each step by its data-i, so it also works after the boxes were moved around
  if (!order.every((v,k)=>v===k)){ cfg.steps = order.map(k=>cfg.steps[k]); ui.matchInfo = {}; }
  render();
}
function dragFrame(){
  if (!stepDrag) return;
  const { el, y, grab } = stepDrag, edge = 70;
  if (y < edge) scrollBy(0, -(edge-y)/4); else if (y > innerHeight-edge) scrollBy(0, (y-innerHeight+edge)/4);
  // put the step before the first other step whose middle is below the finger
  el.style.transform = "";
  const others = [...el.parentNode.children].filter(o=>o!==el);
  const before = others.find(o=>{ const r=o.getBoundingClientRect(); return y < r.top + r.height/2; }) || null;
  if (el.nextElementSibling !== before) el.parentNode.insertBefore(el, before);
  el.style.transform = `translateY(${y - grab - el.getBoundingClientRect().top}px)`;
  requestAnimationFrame(dragFrame);
}
app.addEventListener("pointerdown", e=>{
  const h = e.target.closest("[data-drag]");
  if (!h || stepDrag || e.button>0) return;
  e.preventDefault(); h.setPointerCapture(e.pointerId);
  const el = h.closest(".step-edit");
  stepDrag = { el, grab: e.clientY - el.getBoundingClientRect().top, y: e.clientY };
  el.classList.add("dragging"); requestAnimationFrame(dragFrame);
});
app.addEventListener("pointermove", e=>{ if (stepDrag) stepDrag.y = e.clientY; });
const dragEnd = ()=>{
  if (!stepDrag) return;
  const list = stepDrag.el.parentNode; stepDrag = null;
  moveSteps([...list.children].map(o=>+o.dataset.i));
};
app.addEventListener("pointerup", dragEnd);
app.addEventListener("pointercancel", dragEnd);
app.addEventListener("keydown", e=>{ // the handle also moves a step with the arrow keys
  const h = e.target.closest?.("[data-drag]");
  if (!h || !/^Arrow(Up|Down)$/.test(e.key)) return;
  e.preventDefault();
  const i = +h.dataset.drag, j = e.key==="ArrowUp" ? i-1 : i+1;
  if (j<0 || j>=cfg.steps.length) return;
  const order = cfg.steps.map((_,k)=>k); [order[i], order[j]] = [order[j], order[i]];
  moveSteps(order); document.querySelector(`[data-drag="${j}"]`)?.focus();
});

app.addEventListener("input", e=>{
  if(e.target.id==="team"){ prog.team=e.target.value; saveProg(); }
  if(/^ai-(key|base|model|prompt|vision)$/.test(e.target.id)){ collectAi(); save(KEY_AI, ai); aiMsg(aiStatus()); }
  if(/^tts-(key|base|model|voice|style)$/.test(e.target.id)){ collectTts(); save(KEY_TTS, tts); ttsMsg(ttsStatus()); }
});

window.claude?.hot?.snapshot?.(()=>({ ui:{} })); // never restore an unlocked menu
function start(data){
  const photos = DB.all().then(m=>m.forEach((blob,k)=>imgs.set(k, typeof blob==="string" ? blob : URL.createObjectURL(blob)))).catch(()=>{});
  const voice = DB.all("tts").then(m=>m.forEach((blob,k)=>clips.set(k, blob))).catch(()=>{});
  Promise.all([photos, voice]).finally(render);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
