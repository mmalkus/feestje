<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Dossier Verdwenen Taart</title>
<meta name="theme-color" content="#1f4047">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lexend:wght@400;600;800&family=Special+Elite&display=swap">
<style>
/* Layout: one manila case-file folder lying on a blue-green desk; each screen is a page inside the folder */
:root{
  --desk:#1f4047; --desk-2:#163238; --folder:#e9d29c; --folder-edge:#cdb173;
  --paper:#fdf8ea; --ink:#2b2420; --ink-soft:#6b5d4f; --stamp:#c42f28;
  --tape:#f4d43c; --good:#2d8549; --line:#d9cba8;
  --f-display:"Bungee", "Arial Black", Impact, sans-serif;
  --f-body:"Lexend", "Trebuchet MS", system-ui, sans-serif;
  --f-type:"Special Elite", "Courier New", ui-monospace, monospace;
  color-scheme:light;
}
html{background:var(--desk)}
html,body{min-height:100%}
body{
  background:var(--desk);
  background-image:radial-gradient(circle at 20% 10%, rgba(255,255,255,.06), transparent 50%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 2px, transparent 2px 40px);
  color:var(--ink); font-family:var(--f-body); font-size:18px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:16px calc(16px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:560px; margin:0 auto}
@media (min-width:700px){ #app{max-width:640px} }
.folder{
  position:relative; background:var(--folder); border-radius:4px 14px 10px 10px;
  box-shadow:0 2px 0 var(--folder-edge), 0 18px 40px rgba(0,0,0,.35);
  padding:28px 20px 24px; margin-top:22px;
}

/* the label is the folder tab, so the tab always fits its text; a long team name is shortened, the step number never */
.tab-label{position:absolute; top:-20px; left:0; display:flex; box-sizing:border-box; min-width:42%; max-width:calc(100% - 24px); height:22px;
  padding:4px 16px 0; background:var(--folder); border-radius:10px 10px 0 0; white-space:nowrap;
  font-family:var(--f-type); font-size:14px; line-height:18px; color:var(--ink-soft); letter-spacing:.06em}
.tab-label .tl-a{overflow:hidden; text-overflow:ellipsis; min-width:0}
.tab-label .tl-b{flex:none}
@media (max-width:400px){ .tab-label{font-size:12px; letter-spacing:.03em; padding-inline:12px} }
.stack{display:flex; flex-direction:column; gap:16px}
.stamp{
  display:inline-block; font-family:var(--f-display); color:var(--stamp);
  border:3px solid var(--stamp); border-radius:6px; padding:2px 10px; font-size:15px;
  transform:rotate(-6deg); letter-spacing:.06em; opacity:.88; align-self:flex-start;
}
h1,h2{font-family:var(--f-display); font-weight:400; line-height:1.1; margin:0; text-wrap:balance; overflow-wrap:break-word; hyphens:auto}
/* sized so the longest word ("VERJAARDAGSTAART") still fits a 320px phone */
h1{font-size:clamp(21px, 6.4vw, 40px)}
h2{font-size:clamp(20px, 5.6vw, 28px)}
p{margin:0}
.type{font-family:var(--f-type)}
.muted{color:var(--ink-soft)}
.paper{
  background:var(--paper); border-radius:3px; padding:20px 18px;
  box-shadow:0 1px 0 var(--line), 0 6px 14px rgba(60,40,10,.18);
  background-image:repeating-linear-gradient(transparent 0 31px, rgba(80,120,180,.14) 31px 32px);
  background-position:0 10px; position:relative;
}
.paper.tilt{transform:rotate(-.6deg)}
.tape{position:absolute; top:-12px; left:50%; width:96px; height:24px; margin-left:-48px;
  background:var(--tape); opacity:.85; transform:rotate(3deg); box-shadow:0 1px 2px rgba(0,0,0,.15)}
.riddle{font-size:clamp(18px, 5.6vw, 22px); font-weight:600; line-height:1.45; white-space:pre-line}
.btn{
  appearance:none; border:0; border-radius:12px; min-height:56px; padding:12px 20px;
  font:800 19px/1.2 var(--f-body); cursor:pointer; color:#fff; background:var(--stamp);
  box-shadow:0 4px 0 #8e1f1a; transition:transform .08s;
}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 #8e1f1a}
.btn.alt{background:var(--paper); color:var(--ink); box-shadow:0 4px 0 var(--folder-edge)}
.btn.small{min-height:44px; font-size:16px; padding:8px 14px}
.btn.ghost{background:transparent; color:var(--ink-soft); box-shadow:none; font-weight:600; min-height:44px; text-decoration:underline}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--tape); outline-offset:2px}
.row{display:flex; gap:10px; flex-wrap:wrap}
.row > *{flex:1 1 140px}
input[type=text],textarea,select{
  width:100%; box-sizing:border-box; font:600 18px var(--f-body); color:var(--ink);
  background:#fff; border:2px solid var(--folder-edge); border-radius:10px; padding:12px;
}
textarea{min-height:84px; resize:vertical; font-weight:400}
.code-input{font-family:var(--f-type)!important; font-size:26px!important; text-align:center; letter-spacing:.2em; text-transform:uppercase}
label.lbl{font-size:14px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:4px; letter-spacing:.03em}
.progress{display:flex; gap:6px; align-items:center}
.dot{flex:1; height:10px; border-radius:5px; background:rgba(43,36,32,.15)}
.dot.done{background:var(--good)} .dot.now{background:var(--stamp)}
.msg{min-height:1.5em; font-weight:600; text-align:center}
.msg.bad{color:var(--stamp)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.evidence{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
.evidence li{background:var(--paper); border-left:6px solid var(--tape); padding:10px 12px; border-radius:3px; font-size:16px; display:flex; gap:10px}
.evidence .nr{font-family:var(--f-type); color:var(--stamp); flex:none}
.overlay{position:fixed; inset:0; background:rgba(15,30,34,.78); display:flex; align-items:center; justify-content:center;
  padding:16px max(16px, env(safe-area-inset-right,0px)) 16px max(16px, env(safe-area-inset-left,0px)); z-index:20}
.overlay .paper{max-width:480px; width:100%; animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.85) rotate(-3deg); opacity:.4} to{transform:none; opacity:1}}
.suspects{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px}
.suspect{min-height:88px; background:var(--paper); color:var(--ink); border:3px dashed var(--folder-edge); border-radius:12px;
  font:800 19px var(--f-body); cursor:pointer; padding:10px}
.suspect.wrong{border-color:var(--stamp); opacity:.5; text-decoration:line-through}
.step-edit{border:2px solid var(--folder-edge); border-radius:10px; padding:14px; background:rgba(255,255,255,.35)}
.notes-list{font-family:var(--f-type); font-size:18px; display:flex; flex-direction:column; gap:8px}
.notes-list div{background:var(--paper); padding:10px 12px; border-radius:4px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap}
.notes-list b{letter-spacing:.15em; color:var(--stamp)}
.corner{display:flex; justify-content:space-between; gap:12px; margin-top:16px}
.fs-btn{margin-right:auto;
  background:rgba(0,0,0,.25); color:#e6eef0; border:0; border-radius:20px; padding:8px 14px; font:600 13px var(--f-body); cursor:pointer}
.parents{margin-left:auto;
  background:rgba(0,0,0,.25); color:#e6eef0; border:0; border-radius:20px; padding:8px 14px; font:600 13px var(--f-body); cursor:pointer}
canvas#confetti{position:fixed; inset:0; pointer-events:none; z-index:30; width:100%; height:100%}
.hint-box{background:#fff7c2; border:2px dashed #d3b62a; border-radius:10px; padding:12px; font-size:17px}
.vh{position:absolute; width:1px; height:1px; opacity:0; overflow:hidden}
label.btn{display:flex; align-items:center; justify-content:center; text-align:center; box-sizing:border-box; position:relative}
.zoom,.jig{width:min(100%, 62vh); margin-inline:auto}
.zoom{overflow:hidden; border-radius:6px; aspect-ratio:1; background:var(--ink); margin-top:12px}
.zoom img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s}
.jig{display:grid; grid-template-columns:repeat(3,1fr); gap:3px; aspect-ratio:1; background:var(--ink); padding:3px; border-radius:6px; margin-top:12px}
.jig button{border:0; padding:0; background-size:300% 300%; cursor:pointer; border-radius:2px}
.jig button.sel{outline:5px solid var(--tape); outline-offset:-5px}
.full{max-width:100%; max-height:62vh; border-radius:6px; display:block; margin:12px auto 0}
.slots{display:flex; gap:5px; justify-content:center; margin-top:14px}
.slot{flex:0 1 40px; min-width:0; height:50px; border-bottom:4px solid var(--ink); display:flex; align-items:flex-end; justify-content:center; font:400 26px var(--f-display); color:var(--stamp)}
.letters{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
.tile{width:54px; height:58px; font:400 26px var(--f-display); background:var(--tape); color:var(--ink); border:0; border-radius:10px; box-shadow:0 4px 0 #b39a1f; cursor:pointer}
.tile:disabled{opacity:.2; box-shadow:none}
.thumb{width:96px; height:96px; object-fit:cover; border-radius:6px; flex:none!important}
.busy{text-align:center; font-weight:600; padding:16px 0}
.busy .glass{font-size:48px; display:inline-block; animation:hunt 1.6s ease-in-out infinite}
@keyframes hunt{0%,100%{transform:translateX(-30px) rotate(-10deg)}50%{transform:translateX(30px) rotate(10deg)}}
.album{padding:0 6px; display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px}
.album img{width:100%; background:#fff; padding:6px 6px 24px; box-sizing:border-box; box-shadow:0 4px 10px rgba(0,0,0,.25); transform:rotate(-2deg)}
.album img:nth-child(even){transform:rotate(2deg)}
.viewfinder{position:relative; margin:12px auto 0; width:min(100%, calc(62vh * 4 / 3)); border-radius:6px; overflow:hidden; background:#000; aspect-ratio:4/3}
.viewfinder video{width:100%; height:100%; object-fit:cover; display:block}
.viewfinder video.mirror{transform:scaleX(-1)}
.viewfinder .count{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:400 120px var(--f-display); color:#fff; text-shadow:0 4px 14px rgba(0,0,0,.6); pointer-events:none}
.viewfinder .flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none}
.viewfinder .flash.go{animation:flash .5s ease-out}
@keyframes flash{from{opacity:1} to{opacity:0}}
.check{display:flex; gap:10px; align-items:center; font-size:16px}
.check input{width:24px; height:24px}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
</style>

</head><body>
<div id="app"></div>
<canvas id="confetti" hidden></canvas>

<script>
(function(){
/* Step types: code = riddle + note with code; photo = "waar is dit?" zoomed photo + note; jigsaw = swap-tile photo puzzle + note;
   scramble = letter puzzle on the tablet; camera = photo assignment, optionally turned into a detective picture. */
const TYPES = { code:"Raadsel + briefje", photo:"Waar is dit? (foto)", jigsaw:"Fotopuzzel", scramble:"Letterpuzzel", camera:"Foto-opdracht" };
const NOTE_TYPES = ["code","photo","jigsaw"];

const DEFAULT = {
  title: "De Verdwenen Verjaardagstaart",
  story: "Vanochtend stond er een prachtige verjaardagstaart in de keuken. En nu… is hij WEG! Iemand heeft hem gestolen. Jullie zijn de beste detectives van het hele huis. Volg de aanwijzingen, vind de geheime codes en ontmasker de dader!",
  culpritIndex: 0,
  suspects: ["Papa", "Mama", "De kat", "Een stoute kabouter"],
  finalHide: "In de oven (die staat UIT!) 🎂",
  steps: [
    { type: "camera", ai: true, clue: "Elk detectivebureau heeft een teamfoto nodig! Ga allemaal bij elkaar staan en trek jullie slimste speurneus-gezicht.", evidence: "" },
    { type: "code", clue: "Binnen ben ik koud,\nmaar ik zorg goed voor jullie kaas en melk.\nKijk eens in mijn deur!", place: "Koelkastdeur", code: "SPOOR", hint: "Het staat in de keuken en het zoemt.", evidence: "Er zit slagroom op de deurklink van de keuken. De dader had dus grote handen…" },
    { type: "code", clue: "Ik heb vier poten, maar ik loop nooit.\nAls het eten klaar is, zit iedereen bij mij.\nKruip eens onder mij!", place: "Onder de eettafel", code: "LOEP", hint: "Hier eten jullie elke avond aan.", evidence: "Onder de tafel ligt een schoenafdruk. Maat 44! Dat is een hele grote voet." },
    { type: "scramble", clue: "De dader heeft een woord door elkaar gehusseld! Tik de letters in de goede volgorde.", code: "KRUIMEL", hint: "Wat valt er op de grond als je taart eet?", evidence: "KRUIMEL! Er loopt een spoor van taartkruimels door de gang…" },
    { type: "code", clue: "Ik zit vol met verhalen,\nmaar praten kan ik niet.\nZoek tussen mijn bladzijden!", place: "Boekenkast", code: "VINGER", hint: "Je leest ze voor het slapengaan.", evidence: "In een boek zit een briefje: ‘Niet vergeten: taart verstoppen!’ Het handschrift is erg slordig." },
    { type: "code", clue: "Overdag sta ik bij de deur te wachten.\nIk ruik een beetje naar voeten.\nWie zoekt, die vindt!", place: "Schoenenrek", code: "SLEUTEL", hint: "Hier zet je je schoenen neer als je thuiskomt.", evidence: "In een grote schoen zitten taartkruimels. Chocola!" },
    { type: "code", clue: "Ik heb kussens, maar ik slaap nooit.\nWie op mij zit, kijkt vaak tv.\nVoel eens tussen mijn kussens!", place: "Tussen de kussens van de bank", code: "GEHEIM", hint: "Het is het zachtste meubel in de woonkamer.", evidence: "Tussen de kussens ligt een stropdas met een vlek van slagroom." },
    { type: "code", clue: "Ik draai en draai en draai,\nmaar ik word nooit duizelig.\nIk maak jullie kleren weer schoon!", place: "Bij de wasmachine", code: "TAART", hint: "Kijk waar de vuile was naartoe gaat.", evidence: "Op de wasmachine ligt een bril met chocola op het glas. Wie draagt er een bril én een stropdas?" }
  ]
};
/* Image providers. style: "edits" = OpenAI-style /images/edits (photo in, edited photo out);
   "chat" = /chat/completions with image output (OpenRouter, Gemini image models);
   "mistral" = Mistral agent with the image_generation tool (draws a new picture from a description of the photo). */
const PROVIDERS = {
  openai:     { name:"OpenAI",     base:"https://api.openai.com/v1",    style:"edits",   model:"gpt-image-1" },
  openrouter: { name:"OpenRouter", base:"https://openrouter.ai/api/v1", style:"chat",    model:"google/gemini-2.5-flash-image" },
  mistral:    { name:"Mistral",    base:"https://api.mistral.ai/v1",    style:"mistral", model:"mistral-medium-latest" },
  custom:     { name:"Anders (zelf invullen)", base:"", style:"edits", model:"" }
};
const STYLES = { edits:"Foto bewerken (/images/edits)", chat:"Chat met plaatje terug (/chat/completions)", mistral:"Mistral agent (image_generation)" };
const AI_DEFAULT = {
  provider: "openai", keys: {}, base: PROVIDERS.openai.base, style: "edits", model: "gpt-image-1", models: [],
  prompt: "Turn this photo into a bright, friendly children's picture-book illustration in which everyone is a detective: deerstalker hats, magnifying glasses, little trench coats, a playful mystery atmosphere with a birthday cake hidden somewhere. Keep exactly the same people, their faces, hair, poses and the number of people. Cheerful, warm, kid-friendly, no text."
};

const KEY_CFG = "speurtocht.config.v1", KEY_PROG = "speurtocht.progress.v1", KEY_AI = "speurtocht.ai.v1";
const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };

let cfg = load(KEY_CFG, null) || structuredClone(DEFAULT);
let prog = load(KEY_PROG, null) || { team:"", index:0, phase:"start", wrongSuspects:[] };
prog.sub = prog.sub || {}; prog.photos = prog.photos || [];
let ai = Object.assign({}, AI_DEFAULT, load(KEY_AI, {}));
if (ai.key){ ai.keys = { ...ai.keys, openai: ai.keys.openai || ai.key }; delete ai.key; } // settings from the first version
const aiKey = () => (ai.keys[ai.provider] || "").trim();
let ui = { hintShown:false, overlay:null, gateQ:null, msg:"", zoom:0, busy:"", recover:false, fails:0, lockUntil:0 };

/* ---------- parents' lock: a sum or a PIN; asked every time the menu opens ---------- */
const KEY_LOCK = "speurtocht.lock.v1";
let lock = load(KEY_LOCK, { mode:"math" }); // { mode:"math"|"pin", salt, hash }
async function hashPin(pin, salt){
  const data = `${salt}:${pin}`;
  if (crypto.subtle){ const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(data)); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join(""); }
  let h = 0; for (const c of data) h = (h*31 + c.charCodeAt(0)) | 0; return "w" + h; // plain http on a LAN: no WebCrypto
}
// Two-digit × two-digit (e.g. 12 × 45): fine for a parent, too hard for the kids. Also the PIN recovery question.
const hardSum = () => { const r = () => 11 + (Math.random()*89|0); let a, b; do { a = r(); b = r(); } while (a%10===0 || b%10===0); return { a, b }; };

const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/gi,"").toUpperCase();
const saveProg = () => save(KEY_PROG, prog);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
const scrambled = (a, same) => { let r=a; for(let t=0;t<30;t++){ r=shuffle(a); if(!same(r)) break; } return r; };

/* ---------- photos (IndexedDB; blobs are too big for localStorage) ---------- */
const imgs = new Map(); // id -> object URL
const DB = (()=>{
  let p;
  const open = () => p || (p = new Promise((res,rej)=>{ const r=indexedDB.open("speurtocht",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("img"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }));
  const run = (mode, fn) => open().then(db=>new Promise((res,rej)=>{ const t=db.transaction("img",mode); fn(t.objectStore("img")); t.oncomplete=res; t.onerror=()=>rej(t.error); }));
  return {
    put:(k,v)=>run("readwrite", s=>s.put(v,k)),
    del:k=>run("readwrite", s=>s.delete(k)),
    all:()=>open().then(db=>new Promise((res,rej)=>{ const out=new Map(), c=db.transaction("img").objectStore("img").openCursor();
      c.onsuccess=()=>{ const cur=c.result; if(cur){ out.set(cur.key,cur.value); cur.continue(); } else res(out); }; c.onerror=()=>rej(c.error); }))
  };
})();
const loadImg = src => new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; });
const toBlob = c => new Promise(r=>c.toBlob(r,"image/jpeg",.85));

async function keepBlob(blob, prefix){
  const id = prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  try{ await DB.put(id, blob); }catch(e){} // private mode: keep it in memory only
  imgs.set(id, URL.createObjectURL(blob)); return id;
}
async function storeImage(file, prefix, square){
  const url = URL.createObjectURL(file);
  try{
    const im = await loadImg(url);
    let sx=0, sy=0, sw=im.naturalWidth, sh=im.naturalHeight;
    if(square){ const m=Math.min(sw,sh); sx=(sw-m)/2; sy=(sh-m)/2; sw=sh=m; }
    const sc = Math.min(1, 1024/Math.max(sw,sh)), c=document.createElement("canvas");
    c.width=Math.round(sw*sc); c.height=Math.round(sh*sc);
    c.getContext("2d").drawImage(im, sx,sy,sw,sh, 0,0,c.width,c.height);
    return keepBlob(await toBlob(c), prefix);
  } finally { URL.revokeObjectURL(url); }
}
function dropImage(id){ if(!id) return; DB.del(id).catch(()=>{}); const u=imgs.get(id); if(u) URL.revokeObjectURL(u); imgs.delete(id); }
function gcImages(){
  const keep = new Set([...cfg.steps.map(s=>s.photo), ...prog.photos.flatMap(p=>[p.id,p.orig]), prog.sub.photo, prog.sub.styled]);
  [...imgs.keys()].forEach(k=>{ if(!keep.has(k)) dropImage(k); });
}

/* ---------- detective version of a photo ---------- */
// Offline fallback: sepia "case file" print with a stamp, made on the device.
async function localDetective(id){
  const im = await loadImg(imgs.get(id));
  const pad=40, W=im.naturalWidth+pad*2, H=im.naturalHeight+pad*2+110, c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d");
  x.fillStyle="#fdf8ea"; x.fillRect(0,0,W,H);
  x.drawImage(im, pad, pad);
  const d=x.getImageData(pad,pad,im.naturalWidth,im.naturalHeight), p=d.data;
  for(let i=0;i<p.length;i+=4){ const r=p[i],g=p[i+1],b=p[i+2];
    p[i]=Math.min(255,r*.42+g*.77+b*.19); p[i+1]=Math.min(255,r*.35+g*.69+b*.17); p[i+2]=Math.min(255,r*.27+g*.53+b*.13); }
  x.putImageData(d,pad,pad);

const apiUrl = path => ai.base.trim().replace(/\/+$/,"") + path;
async function api(path, opts={}){

  catch(e){ const host = (()=>{ try{ return new URL(apiUrl(path)).host; }catch(_){ return ai.base; } })();
    throw new Error(`${host} gaf geen antwoord. Is er internet? Zo ja, dan staat ${host} waarschijnlijk geen verzoeken vanaf een webpagina toe (CORS).`); }

async function aiDetective(id){
  const blob = await (await fetch(imgs.get(id))).blob(), prompt = ai.prompt || AI_DEFAULT.prompt;
  const toImage = async url => (await fetch(url)).blob();
  let out;
  if (ai.style === "chat"){
    const j = await api("/chat/completions", { json:{ model:ai.model, modalities:["image","text"], messages:[{ role:"user", content:[
      { type:"text", text:prompt }, { type:"image_url", image_url:{ url: await blobToDataUrl(blob) } } ] }] } });
    const msg = j.choices?.[0]?.message || {};
    const parts = Array.isArray(msg.content) ? msg.content : [];
    const url = msg.images?.[0]?.image_url?.url || parts.find(c=>c.type==="image_url")?.image_url?.url
      || (typeof msg.content==="string" && msg.content.match(/data:image\/[a-z]+;base64,[A-Za-z0-9+/=]+/)?.[0]);
    const b64 = parts.find(c=>c.inline_data||c.b64_json); // other providers' variants
    if (url) out = await toImage(url);
    else if (b64) out = b64ToBlob(b64.inline_data?.data || b64.b64_json);
  } else if (ai.style === "mistral"){
    // Mistral can't edit a photo: the agent looks at it and draws a new picture with its image_generation tool.
    const agent = async fresh => {
      if (fresh || !ai.agent || ai.agent.model!==ai.model || ai.agent.base!==ai.base || ai.agent.key!==aiKey().slice(-6)){
        const a = await api("/agents", { json:{ model:ai.model, name:"Speurtocht tekenaar", description:"Maakt detective-plaatjes van teamfoto's",
          instructions:"You are an illustrator. Look carefully at the attached photo (number of people, hair, clothes, poses) and ALWAYS use the image generation tool to draw the requested picture of these people.",
          tools:[{ type:"image_generation" }] } });
        ai.agent = { id:a.id, model:ai.model, base:ai.base, key:aiKey().slice(-6) }; save(KEY_AI, ai);
      }
      return ai.agent.id;
    };
    const photo = await blobToDataUrl(blob);
    const ask = async (id, withPhoto) => api("/conversations", { json:{ agent_id:id, stream:false, inputs:[{ role:"user", content:
      withPhoto ? [{ type:"text", text:prompt }, { type:"image_url", image_url:photo }] : prompt }] } });
    let j;
    try{ j = await ask(await agent(false), true); }
    catch(e){
      if (e.status===404) j = await ask(await agent(true), true);          // agent was deleted or belongs to another key
      else if (e.status===400 || e.status===422) j = await ask(await agent(false), false); // model can't take the photo: draw from the prompt only
      else throw e;
    }
    const file = (j.outputs||[]).flatMap(o=>Array.isArray(o.content)?o.content:[]).find(c=>c.type==="tool_file" && c.file_id);
    if (file) out = await (await api(`/files/${file.file_id}/content`, { raw:true })).blob();
    else throw new Error(((j.outputs||[]).flatMap(o=>Array.isArray(o.content)?o.content:[{text:o.content}]).map(c=>c.text||"").join(" ").trim().slice(0,120)) || "Mistral maakte geen plaatje");
  } else {
    const send = extra => {
      const f = new FormData();
      f.append("model", ai.model); f.append("prompt", prompt); f.append("image", blob, "foto.jpg");
      if (/gpt-image/.test(ai.model)){ f.append("size","auto"); f.append("quality","medium"); }
      if (extra) f.append("input_fidelity","high");
      return api("/images/edits", { body:f });
    };
    let j;
    try{ j = await send(/gpt-image/.test(ai.model)); }
    catch(e){ if(e.status!==400 || !/gpt-image/.test(ai.model)) throw e; j = await send(false); } // older models don't know input_fidelity
    const d = j.data?.[0] || {};
    if (d.b64_json) out = b64ToBlob(d.b64_json); else if (d.url) out = await toImage(d.url);
  }
  if (!out) throw new Error("Geen plaatje ontvangen");
  return keepBlob(out, "k-");
}

/* ---------- sound ---------- */
let actx;
function beep(ok){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const notes = ok ? [523,659,784,1047] : [220,180];
    notes.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type = ok ? "triangle" : "sawtooth"; o.frequency.value=f;
      g.gain.setValueAtTime(.0001, actx.currentTime+i*.11);
      g.gain.exponentialRampToValueAtTime(.18, actx.currentTime+i*.11+.02);
      g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+i*.11+.25);
      o.connect(g).connect(actx.destination); o.start(actx.currentTime+i*.11); o.stop(actx.currentTime+i*.11+.3);
    });
  }catch(e){}
}

function tick(high){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
    o.frequency.value = high ? 1320 : 880; g.gain.setValueAtTime(.2,t); g.gain.exponentialRampToValueAtTime(.0001,t+.15);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+.2);
  }catch(e){}
}

const cam = { stream:null, pending:null, facing:"user", error:false, busy:false };
const camOk = () => !!navigator.mediaDevices?.getUserMedia && !cam.error;
function camStop(){ cam.stream?.getTracks().forEach(t=>t.stop()); cam.stream=null; }
function camStart(){
  if (cam.stream && cam.stream.getVideoTracks()[0]?.readyState==="ended") camStop(); // e.g. after switching apps
  if (cam.stream) return Promise.resolve(cam.stream);
  return cam.pending || (cam.pending = navigator.mediaDevices.getUserMedia({ audio:false,
      video:{ facingMode:cam.facing, width:{ ideal:1920 }, height:{ ideal:1440 } } })
    .then(st => (cam.stream = st))

// Called after every render: the viewfinder <video> is new each time, so (re)attach the stream, or stop it when gone.
async function camAttach(){

  const st = await camStart(), v = document.getElementById("vf");

  if (st && v.srcObject !== st){ v.srcObject = st; v.play().catch(()=>{}); }

function confetti(){

  const ctx=c.getContext("2d"); const W=c.width=innerWidth, H=c.height=innerHeight;
  const cols=["#c42f28","#f4d43c","#2d8549","#e9d29c","#4aa3c7","#fdf8ea"];
  const ps=Array.from({length:160},()=>({x:Math.random()*W,y:-20-Math.random()*H*.5,r:4+Math.random()*6,c:cols[Math.random()*cols.length|0],vy:2+Math.random()*3,vx:-1.5+Math.random()*3,a:Math.random()*6,va:-.2+Math.random()*.4}));

function stepEditor(s, i){

  const photoLbl = t==="photo" ? "Foto van de verstopplek (de kinderen zien eerst een ingezoomd stukje uit het midden)"

  return `
    <div class="step-edit stack" style="gap:10px" data-i="${i}">
      <div class="row" style="align-items:center"><b style="flex:0 0 auto">Stap ${i+1}</b>
        <span style="display:flex;gap:6px;flex:0 0 auto;margin-left:auto">

          <button class="btn alt small" data-act="down" data-i="${i}" ${i===cfg.steps.length-1?"disabled":""} aria-label="Omlaag">↓</button>
          <button class="btn alt small" data-act="del" data-i="${i}" aria-label="Verwijder stap ${i+1}">✕</button>
        </span></div>
      <div><label class="lbl" for="type-${i}">Soort opdracht</label>
        <select id="type-${i}" data-f="type">${Object.entries(TYPES).map(([v,l])=>`<option value="${v}" ${v===t?"selected":""}>${l}</option>`).join("")}</select></div>
      ${t==="photo"||t==="jigsaw" ? `<div><span class="lbl">${photoLbl}</span>
        <div class="row" style="align-items:center">
          ${hasPhoto ? `<img class="thumb" src="${imgs.get(s.photo)}" alt="">` : `<span class="muted" style="flex:0 0 auto">Nog geen foto</span>`}
          <label class="btn alt small">📷 ${hasPhoto?"Andere foto":"Kies of maak foto"}<input type="file" accept="image/*" class="vh" data-photo="${i}"></label>
        </div></div>` : ""}
      ${note ? `<div><label class="lbl" for="place-${i}">Verstopplek (alleen voor jou)</label><input type="text" id="place-${i}" data-f="place" value="${esc(s.place)}"></div>` : ""}
      <div><label class="lbl" for="clue-${i}">${clueLbl}</label><textarea id="clue-${i}" data-f="clue">${esc(s.clue)}</textarea></div>

        <div><label class="lbl" for="code-${i}">${t==="scramble"?"Woord om te puzzelen":"Geheime code op het briefje"}</label><input type="text" id="code-${i}" data-f="code" value="${esc(s.code)}" class="type" style="text-transform:uppercase"></div>
        <div><label class="lbl" for="hint-${i}">Tip</label><input type="text" id="hint-${i}" data-f="hint" value="${esc(s.hint)}"></div>

      <div><label class="lbl" for="ev-${i}">Bewijsstuk dat ze hier vinden${t==="camera"?" (mag leeg)":""}</label><textarea id="ev-${i}" data-f="evidence" style="min-height:64px">${esc(s.evidence)}</textarea></div>
    </div>`;
}

    <div><label class="lbl" for="ai-key">API-sleutel</label><input type="password" id="ai-key" autocomplete="off" placeholder="sk-…" value="${esc(aiKey())}"></div>

    <textarea id="s-json" class="type" style="font-size:13px;min-height:110px">${esc(JSON.stringify(cfg))}</textarea>
    <div class="row">

function render(){
  let html;
  if (ui.view==="gate") html = renderGate();
  else if (ui.view==="setup") html = renderSetup();
  else if (prog.phase==="clue") html = renderClue();
  else if (prog.phase==="accuse") html = renderAccuse();
  else if (prog.phase==="solved") html = renderSolved();
  else html = renderStart();
  if (!ui.view) html += `<div class="corner">${canFs ? `<button class="fs-btn" data-act="fullscreen">${fsLabel()}</button>` : ""}<button class="parents" data-act="openSetup">Ouders</button></div>`;
  if (ui.overlay) html += ui.overlay;
  app.innerHTML = html;
  camAttach();
  const ci = document.getElementById("code");
  if (ci && !ui.overlay && kind(cfg.steps[prog.index]||{})==="code") ci.focus({preventScroll:true});
}

function collectSetup(){
  cfg.title = document.getElementById("s-title").value.trim() || DEFAULT.title;
  cfg.story = document.getElementById("s-story").value.trim();
  document.querySelectorAll(".step-edit").forEach(el=>{
    const i=+el.dataset.i;
    el.querySelectorAll("[data-f]").forEach(f=>{ cfg.steps[i][f.dataset.f] = f.type==="checkbox" ? f.checked : f.value.trim(); });
  });
  const sus = document.getElementById("s-suspects").value.split(",").map(s=>s.trim()).filter(Boolean);
  cfg.suspects = sus.length>=2 ? sus : cfg.suspects;
  cfg.culpritIndex = Math.min(+document.getElementById("s-culprit").value||0, cfg.suspects.length-1);
  cfg.finalHide = document.getElementById("s-final").value.trim();
  collectAi();
}

function collectAi(){
  ai.keys = { ...ai.keys, [ai.provider]: document.getElementById("ai-key").value.trim() };
  ai.base = document.getElementById("ai-base").value.trim();
  ai.style = document.getElementById("ai-style").value;
  ai.model = document.getElementById("ai-model").value.trim();
  ai.prompt = document.getElementById("ai-prompt").value.trim() || AI_DEFAULT.prompt;
}
const aiReady = () => !!(aiKey() && ai.base && ai.model);
const aiStatus = () => aiReady() ? `✓ Ingesteld: ${PROVIDERS[ai.provider]?.name || ai.base} · ${ai.model}. Wordt meteen bewaard.`
  : "Nog geen sleutel: “Maak er detectives van” bewerkt de foto op het apparaat zelf.";
const aiMsg = t => { const m=document.getElementById("aiMsg"); if(m) m.textContent=t; };

function stepProblem(s){
  const t = s.type||"code";
  if (t==="camera") return s.clue ? "" : "mist nog een opdracht";
  if (t==="scramble") return norm(s.code).length>=2 ? "" : "mist nog een woord om te puzzelen";
  if ((t==="photo"||t==="jigsaw") && !imgs.has(s.photo)) return "mist nog een foto";
  if (!norm(s.code)) return "mist nog een code";
  return t==="code" && !s.clue ? "mist nog een raadsel" : "";
}

function setupMsg(t){ ui.msg=t; const m=document.getElementById("setupMsg"); if(m) m.textContent=t; }

function newProg(team, phase){
  prog.photos.forEach(p=>{ dropImage(p.id); if(p.orig!==p.id) dropImage(p.orig); });
  dropImage(prog.sub.photo); dropImage(prog.sub.styled);
  return { team, index:0, phase, wrongSuspects:[], sub:{}, photos:[] };
}

function solveStep(){
  const s = cfg.steps[prog.index], k = kind(s), last = prog.index===cfg.steps.length-1;
  beep(true); confetti();
  const stamp = { scramble:"PUZZEL OPGELOST!", camera:"FOTO IN HET DOSSIER!" }[k] || "CODE GOED!";
  ui.overlay = `<div class="overlay" role="dialog" aria-modal="true" aria-label="${stamp}"><div class="paper stack"><span class="tape"></span>
    <span class="stamp" style="color:var(--good);border-color:var(--good)">${stamp}</span>
    ${s.evidence ? `<p class="type muted">BEWIJSSTUK #${prog.index+1}</p><p class="riddle" style="font-size:20px">${esc(s.evidence)}</p>` : ""}
    <button class="btn" data-act="next">${last?"Naar de ontknoping":"Volgende opdracht"}</button></div></div>`;
  render(); app.querySelector(".overlay .btn")?.focus();
}

/* ---------- events ---------- */
app.addEventListener("click", async e=>{
  const b = e.target.closest("[data-act]"), act = b?.dataset.act;
  if(act==="begin" || act==="resume") ui.wantFs = true;
  if(ui.wantFs && canFs && !isFs() && act!=="fullscreen" && !e.target.closest("label")) goFull();
  if(!b) return;
  const i=+b.dataset.i, sub=prog.sub;
  ui.msg="";
  switch(act){
    case "begin": case "restart":
      if (act==="restart" && prog.phase!=="start" && !b.dataset.sure){ b.dataset.sure="1"; b.textContent="Zeker weten? Tik nog een keer"; return; }
      prog = newProg((document.getElementById("team")?.value||prog.team||"").trim(), act==="begin"?"clue":"start");
      if(act==="begin"){ keepAwake(); beep(true); }
      ui.hintShown=false; ui.zoom=0; saveProg(); render(); scrollTo(0,0); break;
    case "resume":
      prog.team=(document.getElementById("team")?.value||prog.team).trim(); if(prog.phase==="start") prog.phase="clue";
      keepAwake(); saveProg(); render(); break;
    case "hint": ui.hintShown=true; render(); break;
    case "zoomOut": ui.zoom=Math.min(ui.zoom+1, ZOOMS.length-1); render(); break;
    case "tile": {
      const p=+b.dataset.p;
      if(sub.sel==null || sub.sel===p){ sub.sel = sub.sel===p ? null : p; }
      else { [sub.order[sub.sel], sub.order[p]] = [sub.order[p], sub.order[sub.sel]]; sub.sel=null;
        if(sub.order.every((v,j)=>v===j)){ sub.solved=true; beep(true); confetti(); } }
      saveProg(); render(); break; }
    case "letter": {
      const s=cfg.steps[prog.index], word=norm(s.code);
      sub.picked=[...(sub.picked||[]), +b.dataset.p];
      if(sub.picked.length===word.length){
        const guess=sub.picked.map(p=>word[sub.tiles[p]]).join(""); sub.picked=[]; saveProg();
        if(guess===word) return solveStep();
        beep(false); ui.msg=`“${guess}” is het niet. Probeer het nog een keer!`;
      }
      saveProg(); render(); break; }
    case "unletter": sub.picked=(sub.picked||[]).slice(0,-1); saveProg(); render(); break;
    case "detectify": case "detectLocal": {
      const useAi = act==="detectify" && aiReady(); ui.aiError="";
      ui.busy = useAi ? `De tekenaar van het detectivebureau (${PROVIDERS[ai.provider]?.name || "AI"}) is aan het werk… dit duurt ongeveer een minuut.` : "Even ontwikkelen…";
      render();
      try{ sub.styled = useAi ? await aiDetective(sub.photo) : await localDetective(sub.photo); }
      catch(err){ console.warn(err); if(useAi) ui.aiError = err.message || String(err); else ui.msg = "Dat lukte niet. Gebruik gewoon de gewone foto!"; }
      ui.busy=""; saveProg(); render(); break; }
    case "snap": case "timer": camSnap(act==="timer"); break;
    case "flip": cam.facing = cam.facing==="user" ? "environment" : "user"; camStop(); render(); break;
    case "retake": ui.aiError=""; dropImage(sub.photo); dropImage(sub.styled); prog.sub={}; saveProg(); render(); break;
    case "unstyle": dropImage(sub.styled); delete sub.styled; saveProg(); render(); break;
    case "usePhoto":
      prog.photos.push({ id: sub.styled||sub.photo, orig: sub.photo }); prog.sub={}; saveProg(); solveStep(); break;
    case "next":
      ui.overlay=null; ui.hintShown=false; ui.zoom=0; ui.aiError=""; prog.sub={};
      prog.index++; prog.phase = prog.index>=cfg.steps.length ? "accuse" : "clue";
      saveProg(); render(); scrollTo(0,0); break;
    case "accuse": {
      const k=+b.dataset.k;
      if(k===cfg.culpritIndex){ prog.phase="solved"; saveProg(); beep(true); render(); confetti(); scrollTo(0,0); }
      else { prog.wrongSuspects.push(k); saveProg(); beep(false); ui.msg="Nee hoor! Kijk nog eens goed naar de bewijsstukken."; render(); }
      break; }
    case "party": beep(true); confetti(); break;
    case "loadModels":
      collectAi(); if(!ai.base) return aiMsg("Vul eerst het adres in."); aiMsg("Modellen ophalen…");
      try{ const ms = await fetchModels(); if(!ms.length) throw new Error("Geen modellen gevonden");
        ai.models = ms; save(KEY_AI, ai); collectSetup(); render(); aiMsg(`${ms.length} modellen gevonden.`); }
      catch(err){ aiMsg(`Ophalen lukte niet: ${err.message}`); }
      break;
    case "typeModel": collectSetup(); ai.models=[]; render(); document.getElementById("ai-model")?.focus(); break;
    case "fullscreen": ui.wantFs = !isFs(); ui.wantFs ? goFull() : exitFull(); break;
    case "openSetup": ui.view="gate"; ui.gateQ=null; ui.recover=false; render(); scrollTo(0,0); document.getElementById("gate")?.focus(); break;
    case "back": ui.view=null; ui.recover=false; ui.recovered=false; ui.lockDraft=null; render(); scrollTo(0,0); break;
    case "forgotPin": ui.recover=true; ui.gateQ=null; render(); break;
    case "saveLock": {
      const mode=document.getElementById("lock-mode").value, msg=t=>{ const m=document.getElementById("lockMsg"); if(m) m.textContent=t; };
      if(mode==="math"){ lock={ mode:"math" }; save(KEY_LOCK, lock); ui.lockDraft=null; return msg("Opgeslagen: er wordt een rekensom gevraagd."); }
      const p1=document.getElementById("pin1").value.trim(), p2=document.getElementById("pin2").value.trim();
      if(!p1 && !p2 && lock.mode==="pin" && lock.hash) return msg("De pincode blijft hetzelfde.");
      if(!/^\d{4,8}$/.test(p1)) return msg("Kies een pincode van 4 tot 8 cijfers.");
      if(p1!==p2) return msg("De twee pincodes zijn niet hetzelfde.");
      const salt=Math.random().toString(36).slice(2);
      lock={ mode:"pin", salt, hash: await hashPin(p1, salt) }; save(KEY_LOCK, lock); ui.lockDraft=null; ui.recovered=false;
      document.getElementById("pin1").value=document.getElementById("pin2").value="";
      msg("Pincode opgeslagen. Die wordt voortaan elke keer gevraagd."); break; }
    case "add": collectSetup(); cfg.steps.push({type:"code",clue:"",place:"",code:"",hint:"",evidence:""}); render(); break;
    case "del": collectSetup(); if(cfg.steps.length>1){ cfg.steps.splice(i,1); } render(); break;
    case "up": case "down": { collectSetup(); const j = act==="up"?i-1:i+1; [cfg.steps[i],cfg.steps[j]]=[cfg.steps[j],cfg.steps[i]]; render(); break; }
    case "saveSetup": {
      collectSetup(); save(KEY_AI, ai);
      const bad = cfg.steps.findIndex(s=>stepProblem(s));
      if(bad>=0){ setupMsg(`Stap ${bad+1} ${stepProblem(cfg.steps[bad])}.`); return; }
      save(KEY_CFG,cfg); gcImages();
      if(prog.index>=cfg.steps.length && prog.phase==="clue"){ prog.index=0; prog.sub={}; saveProg(); }
      render(); setupMsg("Opgeslagen."); break; }
    case "copyJson": {
      const t=document.getElementById("s-json");
      navigator.clipboard?.writeText(t.value).then(()=>setupMsg("Gekopieerd."), ()=>{ t.select(); setupMsg("Tekst is geselecteerd: kopieer hem zelf."); })
        ?? (t.select(), setupMsg("Tekst is geselecteerd: kopieer hem zelf."));
      break; }
    case "importJson":
      try{ const c=JSON.parse(document.getElementById("s-json").value);
        if(!Array.isArray(c.steps)||!c.steps.length||!Array.isArray(c.suspects)) throw 0;
        cfg=Object.assign(structuredClone(DEFAULT), c); save(KEY_CFG,cfg); render(); setupMsg("Instellingen overgenomen. Voeg eventuele foto's opnieuw toe.");
      }catch(err){ setupMsg("Die tekst klopt niet. Kopieer alles opnieuw vanaf het andere apparaat."); }
      break;
    case "resetProg": prog=newProg("","start"); saveProg(); render(); setupMsg("Spel staat weer aan het begin."); break;
    case "resetAll":
      if(!b.dataset.sure){ b.dataset.sure="1"; b.textContent="Zeker? Tik nog een keer"; return; }
      cfg=structuredClone(DEFAULT); save(KEY_CFG,cfg); gcImages(); render(); setupMsg("Voorbeeldtocht hersteld."); break;
  }
});

app.addEventListener("change", async e=>{
  const t=e.target;
  if(t.matches('select[data-f="type"]') || t.id==="ai-style"){ collectSetup(); if(t.id==="ai-style") save(KEY_AI, ai); render(); return; }
  if(t.id==="ai-model"){ collectAi(); save(KEY_AI, ai); aiMsg(aiStatus()); return; }
  if(t.id==="lock-mode"){ collectSetup(); ui.lockDraft=t.value; render(); document.getElementById("lock-mode")?.scrollIntoView({block:"center"}); return; }
  if(t.id==="ai-provider"){
    collectSetup(); const p = PROVIDERS[t.value];
    ai.provider = t.value; ai.models = [];
    if (t.value!=="custom"){ ai.base = p.base; ai.style = p.style; ai.model = p.model; }
    save(KEY_AI, ai); render(); return;
  }
  if(t.dataset.photo!==undefined && t.files[0]){
    collectSetup(); setupMsg("Foto wordt verwerkt…");
    try{ cfg.steps[+t.dataset.photo].photo = await storeImage(t.files[0], "p-", true); ui.msg=""; render(); }
    catch(err){ setupMsg("Die foto kon niet geladen worden."); }
    return;
  }
  if(t.id==="cam" && t.files[0]){
    const file=t.files[0]; ui.busy="Foto wordt ontwikkeld…"; ui.msg=""; render();
    try{ const id=await storeImage(file, "k-", false);
      dropImage(prog.sub.photo); dropImage(prog.sub.styled); prog.sub={ photo:id }; saveProg(); }
    catch(err){ ui.msg="Dat lukte niet. Probeer het nog een keer."; }
    ui.busy=""; render();
  }
});

app.addEventListener("submit", e=>{
  e.preventDefault();
  if(e.target.id==="codeForm"){
    const input=document.getElementById("code"), s=cfg.steps[prog.index];
    if(!norm(input.value)) return;
    if(norm(input.value)===norm(s.code)) solveStep();
    else {
      beep(false); input.classList.remove("shake"); void input.offsetWidth; input.classList.add("shake");
      document.getElementById("msg").textContent = "Die code klopt niet. Kijk nog eens goed op het briefje!";
      input.select();
    }
  }
  if(e.target.id==="gateForm") (async()=>{
    const val=document.getElementById("gate").value.trim(), pin = lock.mode==="pin" && lock.hash && !ui.recover;
    if(Date.now() < ui.lockUntil){ ui.msg=`Te vaak fout. Wacht ${Math.ceil((ui.lockUntil-Date.now())/1000)} seconden.`; return render(); }
    const ok = pin ? (await hashPin(val, lock.salt)) === lock.hash : val!=="" && +val === ui.gateQ.a*ui.gateQ.b;
    if(ok){ ui.fails=0; ui.recovered=ui.recover; ui.recover=false; ui.view="setup"; ui.msg=""; render(); scrollTo(0,0); }
    else {
      if(++ui.fails % 5 === 0) ui.lockUntil = Date.now() + 30000;
      ui.msg = pin ? "Die pincode klopt niet." : "Dat is niet goed. Hier is een nieuwe som."; ui.gateQ=null; render();
    }
  })();
});

app.addEventListener("input", e=>{
  if(e.target.id==="team"){ prog.team=e.target.value; saveProg(); }
  if(/^ai-(key|base|model|prompt)$/.test(e.target.id)){ collectAi(); save(KEY_AI, ai); aiMsg(aiStatus()); }
});

window.claude?.hot?.snapshot?.(()=>({ ui:{} })); // never restore an unlocked menu
function start(data){
  DB.all().then(m=>m.forEach((blob,k)=>imgs.set(k, URL.createObjectURL(blob)))).catch(()=>{}).finally(render);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
